# GEMM benchmarking configuration for weight-only quantization (WOQ)
# Covers both symmetric and asymmetric WOQ: bf16 activations multiplied by 4-bit
# quantized weights, with optional fused post-ops where defined below.
# ==============================================================================
# Symmetric WOQ (bf16s4f32of32):
#   - Weights: s4; dequant uses scale factors only. Granularity is set via
#     b_scale_granularity (PER_GROUP / PER_CHANNEL / PER_TENSOR). Scale length is
#     ng*n / n / 1 respectively. No zero_point parameters.
#
# Asymmetric WOQ (bf16u4f32of32):
#   - Weights: u4; dequant uses scale plus zero_point. Scale and zero-point
#     granularities are independent (b_scale_granularity vs
#     b_zp_granularity); each
#     buffer is sized ng*n / n / 1. b_zp_type s8 or bf16.
#
# Common: A=bf16, C=f32, acc=f32, row-major. group_size 0 is one group over
# full K. group_size must be even unless it equals K.
# ==============================================================================

gemm_tests:
  # ==========================================================================
  # WOQ Symmetric - Performance testing
  # ==========================================================================

  # Test 1: Small matrices - Edge cases
  - name: "bf16s4f32of32"
    a_type: "bf16"
    b_type: "s4"
    c_type: "f32"
    acc_type: "f32"
    storage_format: "row-major"
    transA: false
    transB: false
    # Small dimensions to test fringe kernels
    m: [1, 8, 16, 32]
    n: [32, 64]
    k: [32, 64]
    alpha: [1.0]
    beta: [0.0]
    lda: 64
    ldb: 64
    ldc: 64
    mtagA: ["none"]
    mtagB: ["reorder"]
    pre_operations:
      cartesian: false
      operations:
        - type: "WOQ"
          params:
            b_scale_granularity: ["PER_GROUP", "PER_CHANNEL", "PER_TENSOR"]
            b_scale_type: ["f32"]
            group_size: ["0", "16", "12","32","128"]
    post_operations:
      cartesian: false
      operations:
        - type: "Elementwise-RELU"
          params: {}
    tolerances:
      relative: 100.0
      absolute: 50.0
    product_type: "cartesian"

  # ==========================================================================
  # WOQ Asymmetric - Performance testing
  # ==========================================================================

  # Test 2: Medium matrices
  - name: "bf16u4f32of32"
    a_type: "bf16"
    b_type: "u4"
    c_type: "f32"
    acc_type: "f32"
    storage_format: "row-major"
    transA: false
    transB: false
    # Medium sizes for realistic workloads
    m: [1, 8, 16, 32]
    n: [32, 64]
    k: [32, 64]
    alpha: [1.0]
    beta: [0.0]
    lda: 64
    ldb: 64
    ldc: 64
    mtagA: ["none"]
    mtagB: ["reorder"]
    pre_operations:
      cartesian: false
      operations:
        - type: "WOQ"
          params:
            b_scale_granularity: ["PER_GROUP", "PER_CHANNEL", "PER_TENSOR"]
            b_scale_type: ["f32"]
            b_zp_granularity: ["PER_GROUP", "PER_CHANNEL", "PER_TENSOR"]
            b_zp_type: ["s8", "bf16"]
            group_size: ["0", "16", "12","32","128"]
    post_operations:
      cartesian: false
      operations:
        - type: "Elementwise-RELU"
          params: {}
    tolerances:
      relative: 100.0
      absolute: 50.0
    product_type: "cartesian"
