# GEMM test configuration file
#
# ============================================================================
# PRESUBMIT API SMOKE CONFIG
# ============================================================================
# The presubmit pipeline runs `--test-batch-sets "misc,yaml_*"`, which executes
# EVERY test set in this file (each entry becomes a gtest case named
# "yaml_<index>_..."; the wildcard matches all of them).
#
# GOAL: have AT LEAST ONE tiny test case for every classic single-GEMM API the
# DLP currently supports (include/classic/aocl_gemm_interface_apis.h), so a
# regression in any datatype/output/post-op is caught early in presubmit.
#
# Each entry is intentionally SMALL (tiny m/n/k, short lists) so the whole
# config runs fast.
#
# API -> entry map (single GEMM):
#   f32f32f32of32 ................ api_smoke_f32_all_postops
#   f32f16f32of32 ................ api_smoke_f32f16
#   bf16bf16f32of32 / obf16 ...... api_smoke_bf16
#   f16f16f16of16 / of32 ......... api_smoke_fp16
#   u8s8s32o{s32,s8,f32,bf16,u8} . api_smoke_u8s8_all_outputs
#   u8s8s32of16 .................. api_smoke_u8s8_out_fp16
#   s8s8s32o{s32,s8,f32,bf16,u8} . api_smoke_s8s8_all_outputs
#   s8s8s32of16 .................. api_smoke_s8s8_out_fp16
#   bf16s8s32o* (A_Quant) ........ api_smoke_a_quant_bf16s8_all_outputs
#   f32s8s32o*  (A_Quant) ........ api_smoke_a_quant_f32s8_all_outputs
#   s8s8s32o*   (A_Quant on int8)  api_smoke_a_quant_s8s8 / _asym
#   bf16s4f32of32 / obf16 (WOQ) .. api_smoke_woq_bf16s4 / _out_bf16
#   bf16u4f32of32 / obf16 (WOQ) .. api_smoke_woq_bf16u4_asym / _out_bf16_asym
#   post-ops: Bias/Scale/RELU/GELU-ERF ... api_smoke_f32_all_postops
#             GELU-TANH/SWISH/SIGMOID/TANH/CLIP/PRELU/MISH ...
#                                          api_smoke_f32_elementwise_activations
#             Matrix-Add / Matrix-Mul .... api_smoke_matrix_add_mul
#             GLU-GATED_SWIGLU(_AND_MUL) . api_smoke_glu_and_mul / _swiglu
#             int8 downscale (Scale+ZP) .. api_smoke_s8s8_downscale
#   s8s8..._sym_quant (GroupScale) .. api_smoke_groupscale_s8s8
#   odd / fringe dimensions ......... api_smoke_f32_odd_dims,
#             api_smoke_bf16_odd_dims, api_smoke_bf16_odd_dims_reorder,
#             api_smoke_s8s8_odd_dims
# ============================================================================

gemm_tests:
  # --------------------------------------------------------------------------
  # f32 x f32 -> f32 (aocl_gemm_f32f32f32of32) + common post-op chain
  # (Bias -> Scale -> RELU -> GELU-ERF). Covers row/column major and all
  # transpose combinations.
  # --------------------------------------------------------------------------
  - name: "api_smoke_f32_all_postops"
    a_type: ["f32"]
    b_type: ["f32"]
    c_type: ["f32"]
    acc_type: ["f32"]
    storage_format: ["row-major", "column-major"]
    transA: [false, true]
    transB: [false, true]
    m: [1, 16, 33]
    n: [1, 16]
    k: [1, 32]
    alpha: [1.0]
    beta: [0.0]
    mtagA: ["none"]
    mtagB: ["none"]
    fill_value:
      lb: -4.0
      ub: 4.0
      dist: "uniform"
      force_int_distribution: false
    tolerances:
      relative: 100.0
      absolute: 50.0
    post_operations:
      cartesian: false
      operations:
        - type: "Bias"
          params:
            bias_type: ["f32"]
            bias_dim: ["n"]
        - type: "Scale"
          params:
            scale_factor_type: ["f32"]
            scale_factor_len: ["n"]
        - type: "Elementwise-RELU"
        - type: "Elementwise-GELU-ERF"

  # --------------------------------------------------------------------------
  # f32 x fp16 -> f32 (aocl_gemm_f32f16f32of32): f32 activation, fp16 weight.
  # --------------------------------------------------------------------------
  - name: "api_smoke_f32f16"
    a_type: ["f32"]
    b_type: ["fp16"]
    c_type: ["f32"]
    acc_type: ["f32"]
    storage_format: ["row-major"]
    transA: [false, true]
    transB: [false, true]
    m: [1, 16, 33]
    n: [16, 64]
    k: [32]
    alpha: [1.0]
    beta: [0.0]
    mtagA: ["none"]
    mtagB: ["none"]
    fill_value:
      lb: -4.0
      ub: 4.0
      dist: "uniform"
      force_int_distribution: false
    tolerances:
      relative: 1.0e-1
      absolute: 1.0e-1

  # --------------------------------------------------------------------------
  # bf16 x bf16 -> f32 / bf16 (aocl_gemm_bf16bf16f32of32 / obf16),
  # including the reorder-B path.
  # --------------------------------------------------------------------------
  - name: "api_smoke_bf16"
    a_type: ["bf16"]
    b_type: ["bf16"]
    c_type: ["f32", "bf16"]
    acc_type: ["f32"]
    storage_format: ["row-major"]
    transA: [false, true]
    transB: [false, true]
    m: [1, 16, 33]
    n: [16, 64]
    k: [32]
    alpha: [1.0]
    beta: [0.0]
    mtagA: ["none"]
    mtagB: ["none", "reorder"]
    fill_value:
      lb: -4.0
      ub: 4.0
      dist: "uniform"
      force_int_distribution: false
    tolerances:
      relative: 100.0
      absolute: 50.0

  # --------------------------------------------------------------------------
  # fp16 x fp16 -> fp16 / f32 (aocl_gemm_f16f16f16of16 / of32).
  # --------------------------------------------------------------------------
  - name: "api_smoke_fp16"
    a_type: ["fp16"]
    b_type: ["fp16"]
    c_type: ["fp16", "f32"]
    acc_type: ["fp16"]
    storage_format: ["row-major"]
    transA: [false, true]
    transB: [false, true]
    m: [1, 16, 33]
    n: [16, 64]
    k: [32]
    alpha: [1.0]
    beta: [0.0]
    mtagA: ["none"]
    mtagB: ["none"]
    fill_value:
      lb: -4.0
      ub: 4.0
      dist: "uniform"
      force_int_distribution: false
    tolerances:
      relative: 1.0e-1
      absolute: 1.0e-1

  # --------------------------------------------------------------------------
  # u8 x s8 across ALL supported outputs
  # (aocl_gemm_u8s8s32o{s32,s8,f32,bf16,u8}).
  # --------------------------------------------------------------------------
  - name: "api_smoke_u8s8_all_outputs"
    a_type: ["u8"]
    b_type: ["s8"]
    c_type: ["s32", "s8", "f32", "bf16", "u8"]
    acc_type: ["s32"]
    storage_format: ["row-major"]
    transA: [false, true]
    transB: [false, true]
    m: [1, 16]
    n: [16, 20]
    k: [32]
    alpha: [1]
    beta: [0]
    mtagA: ["none"]
    mtagB: ["none", "reorder"]
    tolerances:
      relative: 100.0
      absolute: 50.0

  # --------------------------------------------------------------------------
  # u8 x s8 -> fp16 (aocl_gemm_u8s8s32of16): the f16 output variant.
  # --------------------------------------------------------------------------
  - name: "api_smoke_u8s8_out_fp16"
    a_type: ["u8"]
    b_type: ["s8"]
    c_type: ["fp16"]
    acc_type: ["s32"]
    storage_format: ["row-major"]
    transA: [false, true]
    transB: [false, true]
    m: [1, 16]
    n: [16, 20]
    k: [32]
    alpha: [1]
    beta: [0]
    mtagA: ["none"]
    mtagB: ["none", "reorder"]
    tolerances:
      relative: 100.0
      absolute: 50.0

  # --------------------------------------------------------------------------
  # s8 x s8 across ALL supported outputs
  # (aocl_gemm_s8s8s32o{s32,s8,f32,bf16,u8}).
  # --------------------------------------------------------------------------
  - name: "api_smoke_s8s8_all_outputs"
    a_type: ["s8"]
    b_type: ["s8"]
    c_type: ["s32", "s8", "f32", "bf16", "u8"]
    acc_type: ["s32"]
    storage_format: ["row-major"]
    transA: [false, true]
    transB: [false, true]
    m: [1, 16]
    n: [16, 20]
    k: [32]
    alpha: [1]
    beta: [0]
    mtagA: ["none"]
    mtagB: ["none", "reorder"]
    tolerances:
      relative: 100.0
      absolute: 50.0

  # --------------------------------------------------------------------------
  # s8 x s8 -> fp16 (aocl_gemm_s8s8s32of16): the f16 output variant.
  # --------------------------------------------------------------------------
  - name: "api_smoke_s8s8_out_fp16"
    a_type: ["s8"]
    b_type: ["s8"]
    c_type: ["fp16"]
    acc_type: ["s32"]
    storage_format: ["row-major"]
    transA: [false, true]
    transB: [false, true]
    m: [1, 16]
    n: [16, 20]
    k: [32]
    alpha: [1]
    beta: [0]
    mtagA: ["none"]
    mtagB: ["none", "reorder"]
    tolerances:
      relative: 100.0
      absolute: 50.0

  # --------------------------------------------------------------------------
  # int8 per-token downscale: Scale post-op with scale-factor + zero-point
  # (s8 x s8 -> s32).
  # --------------------------------------------------------------------------
  - name: "api_smoke_s8s8_downscale"
    a_type: ["s8"]
    b_type: ["s8"]
    c_type: ["s32"]
    acc_type: ["s32"]
    storage_format: ["row-major"]
    transA: [false]
    transB: [false]
    m: [6, 13]
    n: [16, 64]
    k: [32]
    alpha: [1]
    beta: [0]
    mtagA: ["none"]
    mtagB: ["none"]
    tolerances:
      relative: 5.0
      absolute: 2.0
    post_operations:
      cartesian: false
      operations:
        - type: "Scale"
          params:
            scale_factor_type: ["f32"]
            scale_factor_len: ["m"]
            zero_point_type: ["s8"]
            zero_point_len: ["n"]

  # --------------------------------------------------------------------------
  # Odd / fringe dimensions (f32): small ODD m/n/k exercise the remainder /
  # partial-vector tail loops that power-of-two shapes (8/16/32/64) skip.
  # --------------------------------------------------------------------------
  - name: "api_smoke_f32_odd_dims"
    a_type: ["f32"]
    b_type: ["f32"]
    c_type: ["f32"]
    acc_type: ["f32"]
    storage_format: ["row-major"]
    transA: [false, true]
    transB: [false, true]
    m: [1, 3, 7, 17]
    n: [1, 5, 13]
    k: [1, 3, 31]
    alpha: [1.0]
    beta: [0.0]
    mtagA: ["none"]
    mtagB: ["none"]
    fill_value:
      lb: -4.0
      ub: 4.0
      dist: "uniform"
      force_int_distribution: false
    tolerances:
      relative: 100.0
      absolute: 50.0

  # --------------------------------------------------------------------------
  # Odd / fringe dimensions (bf16 -> f32), non-reorder B: odd m/n/k including
  # very small k (1, 5) to exercise remainder / partial-vector tail loops.
  # --------------------------------------------------------------------------
  - name: "api_smoke_bf16_odd_dims"
    a_type: ["bf16"]
    b_type: ["bf16"]
    c_type: ["f32"]
    acc_type: ["f32"]
    storage_format: ["row-major"]
    transA: [false]
    transB: [false]
    m: [1, 3, 15, 17]
    n: [1, 7, 33]
    k: [1, 5, 31]
    alpha: [1.0]
    beta: [0.0]
    mtagA: ["none"]
    mtagB: ["none"]
    fill_value:
      lb: -4.0
      ub: 4.0
      dist: "uniform"
      force_int_distribution: false
    tolerances:
      relative: 100.0
      absolute: 50.0

  # --------------------------------------------------------------------------
  # Odd / fringe dimensions (bf16 -> f32) on the reorder-B path. K is kept at
  # or above the BF16 pack width (>= 16) here on purpose: reorder-B packs along
  # K in 16-wide blocks, so tiny K (1/5) is not a meaningful reorder path and
  # was intentionally left to the non-reorder entry above. Odd N/M still
  # exercise the fringe tiles.
  # --------------------------------------------------------------------------
  - name: "api_smoke_bf16_odd_dims_reorder"
    a_type: ["bf16"]
    b_type: ["bf16"]
    c_type: ["f32"]
    acc_type: ["f32"]
    storage_format: ["row-major"]
    transA: [false]
    transB: [false]
    m: [1, 3, 17]
    n: [1, 7, 33]
    k: [17, 31, 33]
    alpha: [1.0]
    beta: [0.0]
    mtagA: ["none"]
    mtagB: ["reorder"]
    fill_value:
      lb: -4.0
      ub: 4.0
      dist: "uniform"
      force_int_distribution: false
    tolerances:
      relative: 100.0
      absolute: 50.0

  # --------------------------------------------------------------------------
  # Odd / fringe dimensions (int8 s8 x s8 -> s32): odd m/n/k on the VNNI path.
  # --------------------------------------------------------------------------
  - name: "api_smoke_s8s8_odd_dims"
    a_type: ["s8"]
    b_type: ["s8"]
    c_type: ["s32"]
    acc_type: ["s32"]
    storage_format: ["row-major"]
    transA: [false, true]
    transB: [false, true]
    m: [1, 3, 17]
    n: [1, 7, 13]
    k: [1, 5, 33]
    alpha: [1]
    beta: [0]
    mtagA: ["none"]
    mtagB: ["none"]
    tolerances:
      relative: 100.0
      absolute: 50.0

  # --------------------------------------------------------------------------
  # Remaining elementwise activations on a single tiny f32 shape
  # (GELU-TANH, SWISH, SIGMOID, TANH, CLIP, PRELU, MISH).
  # --------------------------------------------------------------------------
  - name: "api_smoke_f32_elementwise_activations"
    a_type: ["f32"]
    b_type: ["f32"]
    c_type: ["f32"]
    acc_type: ["f32"]
    storage_format: ["row-major"]
    transA: [false]
    transB: [false]
    m: [16]
    n: [16]
    k: [32]
    alpha: [1.0]
    beta: [0.0]
    mtagA: ["none"]
    mtagB: ["none"]
    fill_value:
      lb: -4.0
      ub: 4.0
      dist: "uniform"
      force_int_distribution: false
    tolerances:
      relative: 5.0
      absolute: 5.0
    post_operations:
      cartesian: false
      operations:
        - type: "Elementwise-GELU-TANH"
        - type: "Elementwise-SWISH"
          params:
            alpha_type: ["f32"]
            alpha: [1.0]
        - type: "Elementwise-SIGMOID"
        - type: "Elementwise-TANH"
        - type: "Elementwise-CLIP"
        - type: "Elementwise-PRELU"
        - type: "Elementwise-MISH"

  # --------------------------------------------------------------------------
  # Matrix-Add / Matrix-Mul post-ops (bf16 in, f32 out).
  # --------------------------------------------------------------------------
  - name: "api_smoke_matrix_add_mul"
    a_type: ["bf16"]
    b_type: ["bf16"]
    c_type: ["f32"]
    acc_type: ["f32"]
    storage_format: ["row-major"]
    transA: [false]
    transB: [false]
    m: [16]
    n: [16]
    k: [32]
    alpha: [1.0]
    beta: [0.0]
    mtagA: ["none"]
    mtagB: ["none"]
    fill_value:
      lb: -4.0
      ub: 4.0
      dist: "uniform"
      force_int_distribution: false
    tolerances:
      relative: 100.0
      absolute: 50.0
    post_operations:
      cartesian: false
      operations:
        - type: "Matrix-Add"
          params:
            matrix_type: ["f32"]
        - type: "Matrix-Mul"
          params:
            matrix_type: ["f32"]

  # --------------------------------------------------------------------------
  # A_Quant with s8 activation x s8 weight (on-the-fly activation quant),
  # symmetric (per-M scale factor).
  # --------------------------------------------------------------------------
  - name: "api_smoke_a_quant_s8s8"
    a_type: ["s8"]
    b_type: ["s8"]
    c_type: ["s32"]
    acc_type: ["s32"]
    storage_format: ["row-major"]
    transA: [false]
    transB: [false]
    m: [16]
    n: [16]
    k: [32]
    alpha: [1]
    beta: [0]
    mtagA: ["none"]
    mtagB: ["none"]
    tolerances:
      relative: 5.0
      absolute: 2.0
    post_operations:
      cartesian: false
      operations:
        - type: "A_Quant"
          params:
            a_quant_sf_type: ["f32"]
            a_quant_sf_len: ["m"]

  # --------------------------------------------------------------------------
  # A_Quant s8 x s8, asymmetric (per-M scale factor + zero-point).
  # --------------------------------------------------------------------------
  - name: "api_smoke_a_quant_s8s8_asym"
    a_type: ["s8"]
    b_type: ["s8"]
    c_type: ["s32"]
    acc_type: ["s32"]
    storage_format: ["row-major"]
    transA: [false]
    transB: [false]
    m: [16]
    n: [16]
    k: [32]
    alpha: [1]
    beta: [0]
    mtagA: ["none"]
    mtagB: ["none"]
    tolerances:
      relative: 5.0
      absolute: 2.0
    post_operations:
      cartesian: false
      operations:
        - type: "A_Quant"
          params:
            a_quant_sf_type: ["f32"]
            a_quant_sf_len: ["m"]
            a_quant_zp_type: ["f32"]
            a_quant_zp_len: ["m"]

  # --------------------------------------------------------------------------
  # A_Quant with bf16 activation x s8 weight (aocl_gemm_bf16s8s32o*):
  # A (bf16) is quantized on-the-fly to int8. Covers all supported outputs.
  # --------------------------------------------------------------------------
  - name: "api_smoke_a_quant_bf16s8_all_outputs"
    a_type: ["bf16"]
    b_type: ["s8"]
    c_type: ["f32", "bf16", "s32", "s8", "u8"]
    acc_type: ["s32"]
    storage_format: ["row-major"]
    transA: [false]
    transB: [false]
    m: [16]
    n: [16]
    k: [32]
    alpha: [1]
    beta: [0]
    mtagA: ["none"]
    mtagB: ["none"]
    tolerances:
      relative: 100.0
      absolute: 50.0
    post_operations:
      cartesian: false
      operations:
        - type: "A_Quant"
          params:
            a_quant_sf_type: ["f32"]
            a_quant_sf_len: ["m"]

  # --------------------------------------------------------------------------
  # A_Quant with f32 activation x s8 weight (aocl_gemm_f32s8s32o*):
  # A (f32) is quantized on-the-fly to int8. Covers all supported outputs.
  # --------------------------------------------------------------------------
  - name: "api_smoke_a_quant_f32s8_all_outputs"
    a_type: ["f32"]
    b_type: ["s8"]
    c_type: ["f32", "bf16", "s32", "s8", "u8"]
    acc_type: ["s32"]
    storage_format: ["row-major"]
    transA: [false]
    transB: [false]
    m: [16]
    n: [16]
    k: [32]
    alpha: [1]
    beta: [0]
    mtagA: ["none"]
    mtagB: ["none"]
    tolerances:
      relative: 100.0
      absolute: 50.0
    post_operations:
      cartesian: false
      operations:
        - type: "A_Quant"
          params:
            a_quant_sf_type: ["f32"]
            a_quant_sf_len: ["m"]

  # --------------------------------------------------------------------------
  # Weight-Only Quantization (WOQ) bf16 x s4 -> f32
  # (aocl_gemm_bf16s4f32of32). B is a 4-bit quantized weight; WOQ supplies the
  # per-N scale factor. Requires the reorder-B path, so mtagB=reorder.
  # --------------------------------------------------------------------------
  - name: "api_smoke_woq_bf16s4"
    a_type: ["bf16"]
    b_type: ["s4"]
    c_type: ["f32"]
    acc_type: ["f32"]
    storage_format: ["row-major"]
    transA: [false]
    transB: [false]
    m: [16]
    n: [16]
    k: [32]
    alpha: [1.0]
    beta: [0.0]
    mtagA: ["none"]
    mtagB: ["reorder"]
    tolerances:
      relative: 100.0
      absolute: 50.0
    post_operations:
      cartesian: false
      operations:
        - type: "WOQ"
          params:
            scale_factor_type: ["f32"]
            scale_factor_len: ["n"]

  # --------------------------------------------------------------------------
  # WOQ bf16 x u4 -> f32, asymmetric (aocl_gemm_bf16u4f32of32):
  # per-N scale factor + zero-point.
  # --------------------------------------------------------------------------
  - name: "api_smoke_woq_bf16u4_asym"
    a_type: ["bf16"]
    b_type: ["u4"]
    c_type: ["f32"]
    acc_type: ["f32"]
    storage_format: ["row-major"]
    transA: [false]
    transB: [false]
    m: [16]
    n: [16]
    k: [32]
    alpha: [1.0]
    beta: [0.0]
    mtagA: ["none"]
    mtagB: ["reorder"]
    tolerances:
      relative: 100.0
      absolute: 50.0
    post_operations:
      cartesian: false
      operations:
        - type: "WOQ"
          params:
            scale_factor_type: ["f32"]
            scale_factor_len: ["n"]
            zero_point_type: ["f32"]
            zero_point_len: ["n"]

  # --------------------------------------------------------------------------
  # WOQ bf16 x s4 -> bf16 output (aocl_gemm_bf16s4f32obf16).
  # --------------------------------------------------------------------------
  - name: "api_smoke_woq_bf16s4_out_bf16"
    a_type: ["bf16"]
    b_type: ["s4"]
    c_type: ["bf16"]
    acc_type: ["f32"]
    storage_format: ["row-major"]
    transA: [false]
    transB: [false]
    m: [16]
    n: [16]
    k: [32]
    alpha: [1.0]
    beta: [0.0]
    mtagA: ["none"]
    mtagB: ["reorder"]
    tolerances:
      relative: 100.0
      absolute: 50.0
    post_operations:
      cartesian: false
      operations:
        - type: "WOQ"
          params:
            scale_factor_type: ["f32"]
            scale_factor_len: ["n"]

  # --------------------------------------------------------------------------
  # WOQ bf16 x u4 -> bf16 output, asymmetric (aocl_gemm_bf16u4f32obf16).
  # --------------------------------------------------------------------------
  - name: "api_smoke_woq_bf16u4_out_bf16_asym"
    a_type: ["bf16"]
    b_type: ["u4"]
    c_type: ["bf16"]
    acc_type: ["f32"]
    storage_format: ["row-major"]
    transA: [false]
    transB: [false]
    m: [16]
    n: [16]
    k: [32]
    alpha: [1.0]
    beta: [0.0]
    mtagA: ["none"]
    mtagB: ["reorder"]
    tolerances:
      relative: 100.0
      absolute: 50.0
    post_operations:
      cartesian: false
      operations:
        - type: "WOQ"
          params:
            scale_factor_type: ["f32"]
            scale_factor_len: ["n"]
            zero_point_type: ["f32"]
            zero_point_len: ["n"]

  # --------------------------------------------------------------------------
  # GLU (GATED_SWIGLU_AND_MUL) terminal post-op (bf16 in). N must be even
  # (n = 2I).
  # --------------------------------------------------------------------------
  - name: "api_smoke_glu_and_mul"
    a_type: ["bf16"]
    b_type: ["bf16"]
