# --------------------------------------------------------------------------
  # sym_quant (GroupScale) N==1 GEMV regression cases.
  #
  # These guard three defects previously found in the s8s8s32 symmetric
  # group-quant GEMV path (aocl_gemm_s8s8s32of32_sym_quant):
  #
  #   Defect 1 - N==1, group_size >= 128, M >= 4, B reordered: the N==1
  #              micro-kernel failed to advance the A pointer to the next
  #              64-wide k-block, so every k iteration after the first
  #              re-read the first block. Only triggers when a group spans
  #              more than one 64-element k iteration (group_size >= 128).
  #   Defect 2 - group straddling a KC (2048) boundary (K > KC and
  #              KC % group_size != 0): the group was split across two KC
  #              panels and mis-accumulated.
  #   Defect 3 - row-major + transA: A is packed, but the N==1 GEMV kernel
  #              read it as plain row-major and ran off the end (OOB).
  #
  # Scale granularity is expressed via a_granularity (PER_GROUP / PER_TOKEN)
  # and b_granularity (PER_GROUP / PER_CHANNEL); the parser sizes the scale
  # arrays automatically (A: M x ng or M x 1; B: ng x N or 1 x N). Single-group
  # cases (k == group_size, or group_size 0) sweep the full 2x2 matrix since
  # PER_GROUP and PER_TOKEN/PER_CHANNEL collapse to the same M x 1 / 1 x N
  # layout there. The multi-group defect-2 cases keep A PER_GROUP: the N==1
  # micro-kernel does not correctly apply a PER_TOKEN A scale with >1 K-group
  # and M>1, so only B sweeps PER_GROUP / PER_CHANNEL.

  # Defect 1: N==1, group_size >= 128, M >= 4. k == group_size keeps a
  # single group so all granularities stay exact. M sweep covers the
  # >=4 / >=8 / primary(16) / multi-tile(>16) micro-kernel paths.
  - name: "regress_symquant_defect1_gemv_n1_gs128"
    a_type: ["s8"]
    b_type: ["s8"]
    c_type: ["f32", "bf16"]
    acc_type: ["s32"]
    storage_format: ["row-major"]
    transA: [false]
    transB: [false]
    m: [1, 2, 3, 4, 5, 7, 8, 9, 15, 16, 17, 31, 32, 48]
    n: [1]
    k: [128]
    alpha: [1]
    beta: [0, 1]
    mtagA: ["none"]
    mtagB: ["reorder"]
    tolerances:
      relative: 100.0
      absolute: 50.0
    post_operations:
      cartesian: false
      operations:
        - type: "GroupScale"
          params:
            a_scale_type: ["f32"]
            b_scale_type: ["f32"]
            group_size: ["128"]
            a_granularity: ["PER_GROUP", "PER_TOKEN"]
            b_granularity: ["PER_GROUP", "PER_CHANNEL"]

  # Full-K single-group edge: group_size=0 normalizes to K. K=130 is not a
  # multiple of 4, so this verifies that the intentional full-K alignment bypass
  # is safe for the N==1 alternate reorder/GEMV path.
  - name: "regress_symquant_gemv_n1_fullk_k130"
    a_type: ["s8"]
    b_type: ["s8"]
    c_type: ["f32", "bf16"]
    acc_type: ["s32"]
    storage_format: ["row-major"]
    transA: [false]
    transB: [false]
    m: [1, 4, 16]
    n: [1]
    k: [130]
    alpha: [1]
    beta: [0, 1]
    mtagA: ["none"]
    mtagB: ["reorder"]
    tolerances:
      relative: 100.0
      absolute: 50.0
    post_operations:
      cartesian: false
      operations:
        - type: "GroupScale"
          params:
            a_scale_type: ["f32"]
            b_scale_type: ["f32"]
            group_size: ["0"]
            a_granularity: ["PER_GROUP", "PER_TOKEN"]
            b_granularity: ["PER_GROUP", "PER_CHANNEL"]

  # Defect 1 (deeper): group_size 256 gives k_iter == 4 inside one group.
  - name: "regress_symquant_defect1_gemv_n1_gs256"
    a_type: ["s8"]
    b_type: ["s8"]
    c_type: ["f32"]
    acc_type: ["s32"]
    storage_format: ["row-major"]
    transA: [false]
    transB: [false]
    m: [4, 8, 16, 17, 33]
    n: [1]
    k: [256]
    alpha: [1]
    beta: [0]
    mtagA: ["none"]
    mtagB: ["reorder"]
    tolerances:
      relative: 100.0
      absolute: 50.0
    post_operations:
      cartesian: false
      operations:
        - type: "GroupScale"
          params:
            a_scale_type: ["f32"]
            b_scale_type: ["f32"]
            group_size: ["256"]
            a_granularity: ["PER_GROUP", "PER_TOKEN"]
            b_granularity: ["PER_GROUP", "PER_CHANNEL"]

  # Defect 3: row-major + transA with N==1 forces A-packing. Single group
  # (k == group_size) keeps scales exact. Before the fix this read out of
  # bounds; after it, the case routes to the general 5-loop GEMM path.
  - name: "regress_symquant_defect3_gemv_n1_transA"
    a_type: ["s8"]
    b_type: ["s8"]
    c_type: ["f32", "bf16"]
    acc_type: ["s32"]
    storage_format: ["row-major"]
    transA: [true]
    transB: [false]
    m: [1, 4, 8, 16, 17, 64]
    n: [1]
    k: [128]
    alpha: [1]
    beta: [0, 1]
    mtagA: ["none"]
    mtagB: ["reorder"]
    tolerances:
      relative: 100.0
      absolute: 50.0
    post_operations:
      cartesian: false
      operations:
        - type: "GroupScale"
          params:
            a_scale_type: ["f32"]
            b_scale_type: ["f32"]
            group_size: ["128"]
            a_granularity: ["PER_GROUP", "PER_TOKEN"]
            b_granularity: ["PER_GROUP", "PER_CHANNEL"]

  # Defect 2: group straddles a KC (2048) boundary. K > 2048 and
  # 2048 % group_size != 0 (2048 % 20 == 8). Multi-group; A PER_GROUP (N==1
  # per-token multi-group is unsupported), B sweeps PER_GROUP / PER_CHANNEL.
  - name: "regress_symquant_defect2_kc_straddle_gs20"
    a_type: ["s8"]
    b_type: ["s8"]
    c_type: ["f32"]
    acc_type: ["s32"]
    storage_format: ["row-major"]
    transA: [false]
    transB: [false]
    m: [1, 4, 16]
    n: [1, 16]
    k: [2180]
    alpha: [1]
    beta: [0, 1]
    mtagA: ["none"]
    mtagB: ["reorder"]
    tolerances:
      relative: 100.0
      absolute: 50.0
    post_operations:
      cartesian: false
      operations:
        - type: "GroupScale"
          params:
            a_scale_type: ["f32"]
            b_scale_type: ["f32"]
            group_size: ["20"]
            a_granularity: ["PER_GROUP"]
            b_granularity: ["PER_GROUP", "PER_CHANNEL"]

  # Defect 2 (larger group): 2048 % 160 == 128, K == 2560 (16 groups).
  - name: "regress_symquant_defect2_kc_straddle_gs160"
    a_type: ["s8"]
    b_type: ["s8"]
    c_type: ["f32"]
    acc_type: ["s32"]
    storage_format: ["row-major"]
    transA: [false]
    transB: [false]
    m: [1, 8, 16]
    n: [1, 16]
    k: [2560]
    alpha: [1]
    beta: [0]
    mtagA: ["none"]
    mtagB: ["reorder"]
    tolerances:
      relative: 100.0
      absolute: 50.0
    post_operations:
      cartesian: false
      operations:
        - type: "GroupScale"
          params:
            a_scale_type: ["f32"]
            b_scale_type: ["f32"]
            group_size: ["160"]
            a_granularity: ["PER_GROUP"]
            b_granularity: ["PER_GROUP", "PER_CHANNEL"]

  # --------------------------------------------------------------------------
  # sym_quant N==1 GEMV BIAS broadcast regression
  # (aocl_gemm_s8s8s32of32_sym_quant).
  #
  # In the N==1 GEMV kernel the 16 accumulator lanes hold 16 different ROWS of
  # C (a single output column), so a length-1 bias must be broadcast to every
  # lane. The bias post-op previously used a masked load of mask 0x0001, which
  # wrote the bias into lane 0 (row 0) only and zeroed rows 1..15 for the bf16,
  # s8, u8 and f32 bias storage types (only DLP_S32 broadcast correctly). This
  # left every row past row 0 (and every M tile past the first) missing the
  # bias. The M sweep crosses the >=4 / >=8 / primary(16) / multi-tile(>16)
  # micro-kernel paths; the bias_type sweep covers each storage-type branch.
  - name: "regress_symquant_gemv_n1_bias_broadcast"
    a_type: ["s8"]
    b_type: ["s8"]
    c_type: ["f32"]
    acc_type: ["s32"]
    storage_format: ["row-major"]
    transA: [false]
    transB: [false]
    m: [4, 8, 16, 17, 32]
    n: [1]
    k: [64]
    alpha: [1]
    beta: [0, 1]
    mtagA: ["none"]
    mtagB: ["reorder"]
    tolerances:
      relative: 100.0
      absolute: 50.0
    post_operations:
      cartesian: false
      operations:
        - type: "GroupScale"
          params:
            a_scale_type: ["f32"]
            b_scale_type: ["f32"]
            group_size: ["0"]
            a_granularity: ["PER_GROUP"]
            b_granularity: ["PER_GROUP"]
        - type: "Bias"
          params:
            bias_type: ["f32", "bf16", "s8", "u8", "s32"]

  # --------------------------------------------------------------------------
  # u8s8s32 N==1 GEMV alpha==0 regression (aocl_gemm_u8s8s32o*).
  #
  # A #596 regression ("skip k-loop + alpha mul when alpha==0") gated the whole
  # MR-row tile loop of the JIT u8s8 N==1 GEMV kernel on alpha!=0, so for
  # M >= MR (16) the full MR-row tiles were never written and C kept garbage;
  # only the M%MR fringe rows below were stored. With alpha==0 the result must
  # be exactly beta*C. M sweep crosses the MR=16 tile boundary; beta 0 (all
  # zero) and 1 (C preserved) both exercise the store path.
  # --------------------------------------------------------------------------
  - name: "regress_u8s8_gemv_n1_alpha0"
    a_type: ["u8"]
    b_type: ["s8"]
    c_type: ["s32", "s8", "bf16", "f32"]
    acc_type: ["s32"]
    storage_format: ["row-major"]
    transA: [false]
    transB: [false]
    m: [1, 8, 15, 16, 17, 32, 33, 64]
    n: [1]
    k: [64]
    alpha: [0]
    beta: [0, 1]
    mtagA: ["none"]
    mtagB: ["reorder"]
    tolerances:
      relative: 100.0
      absolute: 50.0

  # With alpha=0, the public GEMM contract reduces to C := beta*C. Fractional
  - name: "regress_u8s8_gemv_n1_alpha0_fractional_c"
    a_type: ["u8"]
    b_type: ["s8"]
    c_type: ["f32", "bf16", "fp16"]
    acc_type: ["s32"]
    storage_format: ["row-major"]
    transA: [false]
    transB: [false]
    m: [16, 17, 32]
    n: [1]
    k: [64]
    alpha: [0]
    beta: [1, 2, -1]
    mtagA: ["none"]
    mtagB: ["reorder"]
    fill_value:
      lb: 0.75
      ub: 0.75
      dist: "uniform"
      force_int_distribution: false
    tolerances:
      relative: 0.0
      absolute: 0.0
