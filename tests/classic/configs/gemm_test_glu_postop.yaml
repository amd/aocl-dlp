# =============================================================================
# GLU fused post-op validation (GATED_SWIGLU_AND_MUL + GATED_SWIGLU)
# =============================================================================
# GLU is a fused, SHAPE-CHANGING, TERMINAL post-op. The GEMM N is the
# interleaved gate/up width n = 2I (gate = even cols, up = odd cols); the op
# emits I results into the low I columns of the M x (>=2I) output buffer. The
# API requires ldc >= n = 2I; columns [I, 2I) keep their init (the kernel's
# half-width store never writes them, and the reference mirrors this).
#
# `n` need only be EVEN (I may be ODD, e.g. n=18 -> I=9). n == 1 (odd) is
# rejected. beta may be any value (the beta*C_in read path is exercised); only
# the low I output columns are compared meaningfully.
#
# SCOPE. This single suite gives BOTH GLU variants the same extended coverage:
#   * GATED_SWIGLU_AND_MUL -- clamped gpt-oss/OpenAI GLU (a=1.702, L=7.0 baked in):
#       out[j] = silu_a(clip(gate[j], max=L)) * (clip(up[j], -L, L) + 1)
#     Clamp bounds magnitude AND sensitivity -> tighter error. Fill +-8 drives
#     lanes past the +-7 clamp to exercise the saturating branch.
#   * GATED_SWIGLU -- UNCLAMPED SiLU-gated (out[j] ~= silu(gate[j]) * up[j]).
#     Output grows with input magnitude -> bounded fill + wider tolerances.
# For each variant the file sweeps, on both BF16 output dtypes (c_type):
#   - GEMM (m > 1) and GEMV (m == 1)
#   - ROW-MAJOR and COLUMN-MAJOR C
#   - transpose (all transA/transB combos) and non-transpose
#   - pack / reorder of A/B (smaller, row-major-oriented config)
#   - post-ops as a SINGLE terminal GLU and CHAINED behind preceding ops
#
# LAYOUT NOTE. Row-major lands gate/up pairs along SIMD lanes; the half-width
# store compacts along the lane axis. Column-major is realized by the classic
# frame swapping m/n (kernel computes C^T), landing gate/up pairs across the
# accumulator ROWS; the kernel-ops layer de-interleaves cross-register (halve-
# along-M) and stores MR/2 full-width rows. m == 1 GEMV: row-major uses the M1
# kernel half-width store; column-major routes to the N1 kernel and where the
# half-width store is unavailable the harness reports notSupported -> GTEST_SKIP
# instead of failing. pack/reorder are row-major-oriented packings, so the
# framework auto-skips column-major + pack/reorder combinations.
#
# Cache-blocking anchors (classic/config/dlp_gemm_blksz_map.h, BF16BF16F32OF32,
# identical on Zen / Zen4 / Zen5):
#       MR = 6     NR = 64
#       MC = 144   NC = 1024   KC = 4096
# M / N sweeps walk each block param and its multiples with -1 / +1 fringes plus
# MC/NC tile-straddle values so multi-tile / multi-thread work-splitting is
# covered. K sweeps from 1 through KC and 2*KC with odd/even (vdpbf16ps pads odd
# K) and tile-boundary fringes. Odd I is exercised via n = 18/66/130 (I=9/33/65).
#
# Run:
#   ./test_gemm --file tests/classic/configs/gemm_test_glu_postop.yaml
# Multi-thread (drives the split-axis > 1 race-free scratch path):
#   for T in 1 2 4 8 16; do DLP_NUM_THREADS=$T ./test_gemm \
#     -f tests/classic/configs/gemm_test_glu_postop.yaml; done
# =============================================================================
gemm_tests:

  # ###########################################################################
  # GATED_SWIGLU_AND_MUL (clamped). Fill +-8 to exercise the baked +-7 clamp.
  # ###########################################################################

  # --- GEMM m x n x k sweep, ROW-MAJOR + COLUMN-MAJOR, both c_type. alpha != 1
  #     and beta != 0 keep the GEMM-product and beta*C_in read paths live.
  - name: "mulswiglu_gemm_mnk"
    a_type: ["bf16"]
    b_type: ["bf16"]
    c_type: ["f32", "bf16"]
    acc_type: ["f32"]
    storage_format: ["row-major", "column-major"]
    transA: [false]
    transB: [false]
    m: [2, 5, 6, 7, 12, 48, 144, 145, 288]
    n: [16, 18, 62, 64, 66, 128, 130, 256]
    k: [1, 2, 32, 64, 256, 512, 4096]
    alpha: [2.5]
    beta:  [1.5]
    mtagA: ["none"]
    mtagB: ["none"]
    fill_value:
      lb: -8.0
      ub: 8.0
      dist: "uniform"
      force_int_distribution: false
    tolerances:
      relative: 5.0
      absolute: 5.0
    post_operations:
      cartesian: false
      operations:
        - type: "GLU-GATED_SWIGLU_AND_MUL"

  # --- GEMV (m == 1), ROW-MAJOR (M1 half-width store) + COLUMN-MAJOR (N1 path,
  #     GTEST_SKIP where unsupported). beta 0 (in-place compact) + beta != 0
  #     (serialized race-free C_in read + compaction).
  - name: "mulswiglu_gemv"
    a_type: ["bf16"]
    b_type: ["bf16"]
    c_type: ["f32", "bf16"]
    acc_type: ["f32"]
    storage_format: ["row-major", "column-major"]
    transA: [false]
    transB: [false]
    m: [1]
    n: [16, 18, 64, 66, 128, 130, 256]
    k: [1, 2, 32, 64, 256, 512]
    alpha: [2.5]
    beta:  [0.0, 1.5]
    mtagA: ["none"]
    mtagB: ["none"]
    fill_value:
      lb: -8.0
      ub: 8.0
      dist: "uniform"
      force_int_distribution: false
    tolerances:
      relative: 5.0
      absolute: 5.0
    post_operations:
      cartesian: false
      operations:
        - type: "GLU-GATED_SWIGLU_AND_MUL"

  # --- Transpose x layout matrix: all four transA/transB combos crossed with
  #     row-major + column-major. transA/transB only change how A/B are READ
  #     (the kernel still emits the M x 2I interleaved accumulator), so the
  #     gate/up split + half-width store must be unaffected. m == 1 included to
  #     cover the GEMV transpose path too.
  - name: "mulswiglu_transpose"
    a_type: ["bf16"]
    b_type: ["bf16"]
    c_type: ["f32", "bf16"]
    acc_type: ["f32"]
    storage_format: ["row-major", "column-major"]
    transA: [false, true]
    transB: [false, true]
    m: [1, 6, 48, 144]
    n: [16, 64, 66, 128]
    k: [64, 256]
    alpha: [2.5]
    beta:  [1.5]
    mtagA: ["none"]
    mtagB: ["none"]
    fill_value:
      lb: -8.0
      ub: 8.0
      dist: "uniform"
      force_int_distribution: false
    tolerances:
      relative: 5.0
      absolute: 5.0
    post_operations:
      cartesian: false
      operations:
        - type: "GLU-GATED_SWIGLU_AND_MUL"

  # --- Pack / reorder of A/B (smaller, ROW-MAJOR). mtagA none|pack, mtagB
  #     none|pack|reorder (reorder = cached pre-reordered B, the production fast
  #     path). column-major + pack/reorder is auto-skipped by the framework.
  - name: "mulswiglu_pack_reorder"
    a_type: ["bf16"]
    b_type: ["bf16"]
    c_type: ["f32", "bf16"]
    acc_type: ["f32"]
    storage_format: ["row-major"]
    transA: [false]
    transB: [false]
    m: [6, 48, 144]
    n: [64, 66, 128]
    k: [64, 256]
    alpha: [1.0]
    beta:  [0.0]
    mtagA: ["none", "pack"]
    mtagB: ["none", "pack", "reorder"]
    fill_value:
      lb: -8.0
      ub: 8.0
      dist: "uniform"
      force_int_distribution: false
    tolerances:
      relative: 5.0
      absolute: 5.0
    post_operations:
      cartesian: false
      operations:
        - type: "GLU-GATED_SWIGLU_AND_MUL"

  # --- TIGHT correctness gate (row + col): small, low-K, unsaturated (+-1) so
  #     bf16 rounding is tiny -- the absolute 0.05 tolerance is a genuine
  #     layout/math gate that the looser sweeps above would mask.
  - name: "mulswiglu_tight_gate"
    a_type: ["bf16"]
    b_type: ["bf16"]
    c_type: ["f32"]
    acc_type: ["f32"]
    storage_format: ["row-major", "column-major"]
    transA: [false]
    transB: [false]
    m: [2, 6, 7, 13]
    n: [16, 18, 64, 66]
    k: [1, 2, 8]
    alpha: [1.0]
    beta:  [0.0]
    mtagA: ["none"]
    mtagB: ["none"]
    fill_value:
      lb: -1.0
      ub: 1.0
      dist: "uniform"
      force_int_distribution: false
    tolerances:
      relative: 1.0
      absolute: 0.05
    post_operations:
      cartesian: false
      operations:
        - type: "GLU-GATED_SWIGLU_AND_MUL"

  # --- CHAINED (single preceding op -> GLU): a shape-PRESERVING op runs on the
  #     full M x 2I interleaved accumulator, then the TERMINAL GLU does the
  #     half-width store. Bias and an elementwise activation, both layouts.
  - name: "mulswiglu_chain_bias"
    a_type: ["bf16"]
    b_type: ["bf16"]
    c_type: ["f32", "bf16"]
    acc_type: ["f32"]
    storage_format: ["row-major", "column-major"]
    transA: [false]
    transB: [false]
    m: [6, 17, 144]
    n: [64, 66, 128]
    k: [64, 256]
    alpha: [1.0, 2.5]
    beta:  [0.0, 1.5]
    mtagA: ["none"]
    mtagB: ["none"]
    tolerances:
      relative: 5.0
      absolute: 5.0
    post_operations:
      cartesian: false
      operations:
        - type: "Bias"
          params:
            bias_type: ["f32"]
            bias_dim: ["n"]
        - type: "GLU-GATED_SWIGLU_AND_MUL"

  - name: "mulswiglu_chain_relu"
    a_type: ["bf16"]
    b_type: ["bf16"]
    c_type: ["f32", "bf16"]
    acc_type: ["f32"]
    storage_format: ["row-major", "column-major"]
    transA: [false]
    transB: [false]
    m: [1, 6, 48]
    n: [64, 66, 128]
    k: [64, 256]
    alpha: [1.0]
    beta:  [0.0, 1.5]
    mtagA: ["none"]
    mtagB: ["none"]
    tolerances:
      relative: 5.0
      absolute: 5.0
    post_operations:
      cartesian: false
      operations:
        - type: "Elementwise-RELU"
        - type: "GLU-GATED_SWIGLU_AND_MUL"

  # --- MULTI-OP chain (Bias -> RELU -> Scale -> GLU): the whole pre-GLU pipeline
  #     must compose before the half-width store. GLU stays last (terminal).
  - name: "mulswiglu_chain_multi"
    a_type: ["bf16"]
    b_type: ["bf16"]
    c_type: ["f32", "bf16"]
    acc_type: ["f32"]
    storage_format: ["row-major", "column-major"]
    transA: [false]
    transB: [false]
    m: [6, 17, 48]
    n: [64, 66, 128]
    k: [64, 256]
    alpha: [1.0, 2.5]
    beta:  [0.0, 1.5]
    mtagA: ["none"]
    mtagB: ["none"]
    tolerances:
      relative: 5.0
      absolute: 5.0
    post_operations:
      cartesian: false
      operations:
        - type: "Bias"
          params:
            bias_type: ["f32"]
            bias_dim: ["n"]
        - type: "Elementwise-RELU"
        - type: "Scale"
          params:
            scale_factor_type: ["f32"]
            scale_factor_len: ["n"]
        - type: "GLU-GATED_SWIGLU_AND_MUL"

  # --- CHAINED with pack/reorder (Bias -> RELU -> GLU, ROW-MAJOR): confirms the
  #     packed/reordered A/B paths compose with a multi-op pre-GLU pipeline.
  - name: "mulswiglu_chain_pack_reorder"
    a_type: ["bf16"]
    b_type: ["bf16"]
    c_type: ["f32", "bf16"]
    acc_type: ["f32"]
    storage_format: ["row-major"]
    transA: [false]
    transB: [false]
    m: [6, 48, 144]
    n: [64, 66, 128]
    k: [64, 256]
    alpha: [1.0]
    beta:  [0.0, 1.5]
    mtagA: ["none", "pack"]
    mtagB: ["none", "pack", "reorder"]
    tolerances:
      relative: 5.0
      absolute: 5.0
    post_operations:
      cartesian: false
      operations:
        - type: "Bias"
          params:
            bias_type: ["f32"]
            bias_dim: ["n"]
        - type: "Elementwise-RELU"
        - type: "GLU-GATED_SWIGLU_AND_MUL"

  # ###########################################################################
  # GATED_SWIGLU (unclamped). Bounded fill (+-1 / +-2) + wider tolerances because
  # the unclamped SiLU*up grows with input magnitude.
  # ###########################################################################

  # --- GEMM m x n x k sweep, ROW-MAJOR + COLUMN-MAJOR, both c_type.
  - name: "swiglu_gemm_mnk"
    a_type: ["bf16"]
    b_type: ["bf16"]
    c_type: ["f32", "bf16"]
    acc_type: ["f32"]
    storage_format: ["row-major", "column-major"]
    transA: [false]
    transB: [false]
    m: [2, 5, 6, 7, 12, 48, 144, 145, 288]
    n: [16, 18, 62, 64, 66, 128, 130, 256]
    k: [1, 2, 32, 64, 256, 512, 4096]
    alpha: [1.0]
    beta:  [0.0]
    mtagA: ["none"]
    mtagB: ["none"]
    fill_value:
      lb: -2.0
      ub: 2.0
      dist: "uniform"
      force_int_distribution: false
    tolerances:
      relative: 5.0
      absolute: 5.0
    post_operations:
      cartesian: false
      operations:
        - type: "GLU-GATED_SWIGLU"

  # --- GEMV (m == 1), ROW-MAJOR + COLUMN-MAJOR, beta 0 / beta != 0.
  - name: "swiglu_gemv"
    a_type: ["bf16"]
    b_type: ["bf16"]
    c_type: ["f32", "bf16"]
    acc_type: ["f32"]
    storage_format: ["row-major", "column-major"]
    transA: [false]
    transB: [false]
    m: [1]
    n: [16, 18, 64, 66, 128, 130, 256]
    k: [1, 2, 32, 64, 256, 512]
    alpha: [1.0]
    beta:  [0.0, 1.5]
    mtagA: ["none"]
    mtagB: ["none"]
    fill_value:
      lb: -2.0
      ub: 2.0
      dist: "uniform"
      force_int_distribution: false
    tolerances:
      relative: 5.0
      absolute: 5.0
    post_operations:
      cartesian: false
      operations:
        - type: "GLU-GATED_SWIGLU"

  # --- Transpose x layout matrix (incl. m == 1 GEMV transpose).
  - name: "swiglu_transpose"
    a_type: ["bf16"]
    b_type: ["bf16"]
    c_type: ["f32", "bf16"]
    acc_type: ["f32"]
    storage_format: ["row-major", "column-major"]
    transA: [false, true]
    transB: [false, true]
    m: [1, 6, 48, 144]
    n: [16, 64, 66, 128]
    k: [64, 256]
    alpha: [1.0]
    beta:  [0.0]
    mtagA: ["none"]
    mtagB: ["none"]
    fill_value:
      lb: -2.0
      ub: 2.0
      dist: "uniform"
      force_int_distribution: false
    tolerances:
      relative: 5.0
      absolute: 5.0
    post_operations:
      cartesian: false
      operations:
        - type: "GLU-GATED_SWIGLU"

  # --- Pack / reorder of A/B (smaller, ROW-MAJOR).
  - name: "swiglu_pack_reorder"
    a_type: ["bf16"]
    b_type: ["bf16"]
    c_type: ["f32", "bf16"]
    acc_type: ["f32"]
    storage_format: ["row-major"]
    transA: [false]
    transB: [false]
    m: [6, 48, 144]
    n: [64, 66, 128]
    k: [64, 256]
    alpha: [1.0]
    beta:  [0.0]
    mtagA: ["none", "pack"]
    mtagB: ["none", "pack", "reorder"]
    fill_value:
      lb: -2.0
      ub: 2.0
      dist: "uniform"
      force_int_distribution: false
    tolerances:
      relative: 5.0
      absolute: 5.0
    post_operations:
      cartesian: false
      operations:
        - type: "GLU-GATED_SWIGLU"

  # --- TIGHT correctness gate (row + col): small, low-K, +-1 fill, abs 0.05.
  - name: "swiglu_tight_gate"
    a_type: ["bf16"]
    b_type: ["bf16"]
    c_type: ["f32"]
    acc_type: ["f32"]
    storage_format: ["row-major", "column-major"]
    transA: [false]
    transB: [false]
    m: [2, 6, 7, 13]
    n: [16, 18, 64, 66]
    k: [1, 2, 8]
    alpha: [1.0]
    beta:  [0.0]
    mtagA: ["none"]
    mtagB: ["none"]
    fill_value:
      lb: -1.0
      ub: 1.0
      dist: "uniform"
      force_int_distribution: false
    tolerances:
      relative: 1.0
      absolute: 0.05
    post_operations:
      cartesian: false
      operations:
        - type: "GLU-GATED_SWIGLU"

  # --- CHAINED (single preceding op -> GLU): Bias and an elementwise activation.
  - name: "swiglu_chain_bias"
    a_type: ["bf16"]
    b_type: ["bf16"]
    c_type: ["f32", "bf16"]
    acc_type: ["f32"]
    storage_format: ["row-major", "column-major"]
    transA: [false]
    transB: [false]
    m: [6, 17, 144]
    n: [64, 66, 128]
    k: [64, 256]
    alpha: [1.0]
    beta:  [0.0, 1.5]
    mtagA: ["none"]
    mtagB: ["none"]
    fill_value:
      lb: -1.0
      ub: 1.0
      dist: "uniform"
      force_int_distribution: false
    tolerances:
      relative: 5.0
      absolute: 5.0
    post_operations:
      cartesian: false
      operations:
        - type: "Bias"
          params:
            bias_type: ["f32"]
            bias_dim: ["n"]
        - type: "GLU-GATED_SWIGLU"

  - name: "swiglu_chain_relu"
    a_type: ["bf16"]
    b_type: ["bf16"]
    c_type: ["f32", "bf16"]
    acc_type: ["f32"]
    storage_format: ["row-major", "column-major"]
    transA: [false]
    transB: [false]
    m: [1, 6, 48]
    n: [64, 66, 128]
    k: [64, 256]
    alpha: [1.0]
    beta:  [0.0, 1.5]
    mtagA: ["none"]
    mtagB: ["none"]
    fill_value:
      lb: -1.0
      ub: 1.0
      dist: "uniform"
      force_int_distribution: false
    tolerances:
      relative: 5.0
      absolute: 5.0
    post_operations:
      cartesian: false
      operations:
        - type: "Elementwise-RELU"
        - type: "GLU-GATED_SWIGLU"

  # --- MULTI-OP chain (Bias -> RELU -> Scale -> GLU).
  - name: "swiglu_chain_multi"
    a_type: ["bf16"]
    b_type: ["bf16"]
    c_type: ["f32", "bf16"]
    acc_type: ["f32"]
    storage_format: ["row-major", "column-major"]
    transA: [false]
    transB: [false]
    m: [6, 17, 48]
    n: [64, 66, 128]
    k: [64, 256]
    alpha: [1.0]
    beta:  [0.0, 1.5]
    mtagA: ["none"]
    mtagB: ["none"]
    fill_value:
      lb: -1.0
      ub: 1.0
      dist: "uniform"
      force_int_distribution: false
    tolerances:
      relative: 5.0
      absolute: 5.0
    post_operations:
      cartesian: false
      operations:
        - type: "Bias"
          params:
            bias_type: ["f32"]
            bias_dim: ["n"]
        - type: "Elementwise-RELU"
        - type: "Scale"
          params:
            scale_factor_type: ["f32"]
            scale_factor_len: ["n"]
        - type: "GLU-GATED_SWIGLU"

  # --- CHAINED with pack/reorder (Bias -> RELU -> GLU, ROW-MAJOR).
  - name: "swiglu_chain_pack_reorder"
    a_type: ["bf16"]
    b_type: ["bf16"]
    c_type: ["f32", "bf16"]
    acc_type: ["f32"]
    storage_format: ["row-major"]
    transA: [false]
    transB: [false]
    m: [6, 48, 144]
    n: [64, 66, 128]
    k: [64, 256]
    alpha: [1.0]
    beta:  [0.0, 1.5]
    mtagA: ["none", "pack"]
    mtagB: ["none", "pack", "reorder"]
    fill_value:
      lb: -1.0
      ub: 1.0
      dist: "uniform"
      force_int_distribution: false
    tolerances:
      relative: 5.0
      absolute: 5.0
    post_operations:
      cartesian: false
      operations:
        - type: "Bias"
          params:
            bias_type: ["f32"]
            bias_dim: ["n"]
        - type: "Elementwise-RELU"
        - type: "GLU-GATED_SWIGLU"
