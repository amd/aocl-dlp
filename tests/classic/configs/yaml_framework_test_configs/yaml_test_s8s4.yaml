  # 14.1: base 5-loop, FULL m x n x k crossing product (all 8 combinations incl.
  # triple), across every B path (reorder/pack/none), both dtypes, both beta,
  # single group (gs=0) and clean multi-group (gs=128). Scalar scales.
  - name: "multipanel_base_full"
    a_type: ["s8"]
    b_type: ["s4"]
