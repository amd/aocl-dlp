# ============================================================================
# SECTION 14 -- MULTI-PANEL (2nd-iteration) STRESS across all variant paths.
#
# Every set above stays within one MC(144)/NC(1024)/KC(2048) panel on at least
# two of the three loop axes, so the "second iteration" of the ic/jc/pc loops
# and their combined state (group-scale pointer advance, packed-panel reuse,
# fringe stores on a partial 2nd panel) was only lightly exercised. This section
# crosses the panel boundaries SINGLY, PAIRWISE and ALL-THREE-AT-ONCE (triple)
# for every distinct path. Most 5-loop sets sweep the full m x n x k product:
#   m: [16, 150]   -> 150 > MC(144)  (ic loop iterates)
#   n: [64, 1088]  -> 1088 > NC(1024)(jc loop iterates)
#   k: [256, 2176] -> 2176 > KC(2048)(pc loop iterates)
# giving all 8 crossing combinations (none / each single / each pair / triple)
# in one set. Boundaries are crossed by a small margin so the 2nd panel is a
# partial fringe -- the more bug-prone case. Runtime is intentionally NOT a
# constraint here: the naive O(M*N*K) reference makes the triple-crossing cases
# slow, but full path coverage is the priority. If a quick pass is needed, use
# --gtest_filter to exclude "*multipanel*".
#
# Scale-length rule (see file header): per-row/col scales (len "m"/"n") are
# exact ONLY for a single group, so multi-group sets here use scalar scales
# (len "1"); per-row/col scales are swept only in the gs=0 single-group set.
#
# Tolerance is the file-standard relative:100 / absolute:50 (multipliers on
# epsilon*k). Tighter multipliers were tried but produce false positives at
# large K: when a dot product nearly cancels to ~0, the DLP and reference
# results differ by a single f32 quantum (e.g. -0.0039 vs -0.0029), which is a
# huge RELATIVE diff on a near-zero value yet meaningless. The standard
# tolerance still catches genuine multi-panel defects, which manifest as large,
# systematic errors across many outputs (or crashes), not one near-zero quantum.
# NOTE: the reference (gemm_s8s8s32of32_sym_quant_ref.cc) mirrors the DLP KC
# grow/shrink so straddle group sizes accumulate in the same float order.
# ============================================================================

  # 14.0a: GEMV N==1 fast path at panel crossing. reorder + gs dividing k and
  # KC keeps it GEMV-eligible; m=150 crosses MC, k=2176 crosses KC on GEMV-N.
  - name: "multipanel_gemv_n1"
    a_type: ["s8"]
    b_type: ["s4"]
    c_type: ["f32", "bf16"]
    acc_type: ["s32"]
    storage_format: ["row-major"]
    transA: [false]
    transB: [false]
    m: [16, 150]
    n: [1]
    k: [256, 2176]
    alpha: [1]
    beta: [0, 1]
    mtagA: ["none"]
    mtagB: ["reorder"]
    tolerances:
      relative: 100.0
      absolute: 50.0
    post_operations:
      cartesian: false
      operations:
        - type: "GroupScale"
          params:
            a_scale_type: ["f32"]
            a_scale_len: ["1"]
            b_scale_type: ["f32"]
            b_scale_len: ["1"]
            group_size: ["64", "128"]

  # 14.0b: GEMV M==1 fast path at panel crossing. n=1088 crosses NC, k=2176
  # crosses KC on the M==1 widen path.
  - name: "multipanel_gemv_m1"
    a_type: ["s8"]
    b_type: ["s4"]
    c_type: ["f32", "bf16"]
    acc_type: ["s32"]
    storage_format: ["row-major"]
    transA: [false]
