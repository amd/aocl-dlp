  # 14.5: multi-group group-scale pointer advance ACROSS the 2nd K-panel with
  # partial/straddle groups, combined with MC and NC crossing. gs=20 and gs=160
  # straddle KC(2048) (2048%20=8, 2048%160=128); gs=192 also gives a partial
  # trailing group at k=2176 (2176%192=64). Scalar scales.
  - name: "multipanel_groupstraddle_full"
    a_type: ["s8"]
    b_type: ["s4"]
    c_type: ["f32", "bf16"]
    acc_type: ["s32"]
    storage_format: ["row-major"]
    transA: [false]
    transB: [false]
    m: [16, 150]
    n: [64, 1088]
    k: [2176]
    alpha: [1]
    beta: [0]
    mtagA: ["none"]
    mtagB: ["reorder", "pack"]
    tolerances:
      relative: 100.0
      absolute: 50.0
    post_operations:
      cartesian: false
      operations:
        - type: "GroupScale"
          params:
            a_scale_type: ["f32"]
            a_scale_len: ["1"]
            b_scale_type: ["f32"]
            b_scale_len: ["1"]
            group_size: ["20", "160", "192"]

  # 14.6: alpha != 1 (integer accumulator scale) + beta accumulate at full
  # crossing, single group.
  - name: "multipanel_alpha_beta_full"
    a_type: ["s8"]
    b_type: ["s4"]
    c_type: ["f32"]
    acc_type: ["s32"]
    storage_format: ["row-major"]
    transA: [false]
    transB: [false]
    m: [16, 150]
    n: [64, 1088]
    k: [256, 2176]
    alpha: [2]
    beta: [0, 1]
    mtagA: ["none"]
    mtagB: ["reorder"]
    tolerances:
      relative: 100.0
      absolute: 50.0
    post_operations:
