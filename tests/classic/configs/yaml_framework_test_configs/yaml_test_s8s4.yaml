    n: [1, 32, 80]
    k: [128]
    alpha: [1]
    beta: [0]
    mtagA: ["none"]
    mtagB: ["reorder"]
    tolerances:
      relative: 100.0
      absolute: 50.0
    post_operations:
      cartesian: false
      operations:
        - type: "GroupScale"
          params:
            a_scale_type: ["f32"]
            b_scale_type: ["f32"]
            group_size: ["0", "128"]
            a_granularity: ["PER_TOKEN"]
            b_granularity: ["PER_CHANNEL"]

  # 15.7: MULTI-PANEL crossing (MC=144 / NC=1024 / KC=2048) with per-token/
  # per-channel, multi-group. Ensures the collapsed A/B scale indexing stays
  # correct across 2nd-iteration ic/jc/pc panels. reorder + pack, both dtypes.
  - name: "pertoken_perchannel_multipanel"
    a_type: ["s8"]
    b_type: ["s4"]
    c_type: ["f32", "bf16"]
    acc_type: ["s32"]
    storage_format: ["row-major"]
    transA: [false]
    transB: [false]
    m: [16, 150]
    n: [64, 1088]
    k: [2176]
    alpha: [1]
    beta: [0]
    mtagA: ["none"]
    mtagB: ["reorder", "pack"]
    tolerances:
      relative: 100.0
      absolute: 50.0
    post_operations:
      cartesian: false
      operations:
        - type: "GroupScale"
          params:
            a_scale_type: ["f32"]
            b_scale_type: ["f32"]
            group_size: ["64"]
            a_granularity: ["PER_TOKEN"]
            b_granularity: ["PER_CHANNEL"]
