          params:
            a_scale_type: ["f32"]
            a_scale_len: ["1"]
            b_scale_type: ["f32"]
            b_scale_len: ["1"]
            group_size: ["0"]

  # 14.7: Bias (per-N) epilogue at full crossing. The bias vector is indexed by
  # column, so this specifically validates reading the operand across the 2nd NC
  # panel while the pc loop also iterates. Both dtypes.
  - name: "multipanel_postop_bias_full"
    a_type: ["s8"]
    b_type: ["s4"]
    c_type: ["f32", "bf16"]
    acc_type: ["s32"]
    storage_format: ["row-major"]
    transA: [false]
    transB: [false]
    m: [16, 150]
    n: [64, 1088]
    k: [256, 2176]
    alpha: [1]
    beta: [0]
    mtagA: ["none"]
    mtagB: ["reorder"]
    tolerances:
      relative: 100.0
      absolute: 50.0
    post_operations:
      cartesian: false
      operations:
        - type: "GroupScale"
          params:
            a_scale_type: ["f32"]
            a_scale_len: ["1"]
            b_scale_type: ["f32"]
            b_scale_len: ["1"]
            group_size: ["0"]
        - type: "Bias"
          params:
            bias_type: ["f32"]
            bias_dim: ["n"]

  # 14.8: Scale (per-N "downscale") epilogue at full crossing -- another
  # column-indexed operand read across the 2nd NC panel.
  - name: "multipanel_postop_scale_full"
    a_type: ["s8"]
    b_type: ["s4"]
    c_type: ["f32", "bf16"]
    acc_type: ["s32"]
    storage_format: ["row-major"]
    transA: [false]
    transB: [false]
    m: [16, 150]
    n: [64, 1088]
    k: [256, 2176]
    alpha: [1]
    beta: [0]
    mtagA: ["none"]
    mtagB: ["reorder"]
    tolerances:
      relative: 100.0
      absolute: 50.0
    post_operations:
      cartesian: false
      operations:
        - type: "GroupScale"
          params:
            a_scale_type: ["f32"]
            a_scale_len: ["1"]
            b_scale_type: ["f32"]
            b_scale_len: ["1"]
            group_size: ["0"]
        - type: "Scale"
          params:
            scale_factor: ["0.5"]
            scale_factor_type: ["f32"]
            scale_factor_len: ["1", "n"]

  # 14.9: fused epilogue chain (Bias -> RELU -> Scale) at full crossing, both
  # dtypes -- ordered multi-op fusion on the 2nd jc/pc panels.
  - name: "multipanel_postop_chain_full"
    a_type: ["s8"]
    b_type: ["s4"]
    c_type: ["f32", "bf16"]
    acc_type: ["s32"]
    storage_format: ["row-major"]
    transA: [false]
    transB: [false]
    m: [16, 150]
    n: [64, 1088]
    k: [256, 2176]
    alpha: [1]
    beta: [0]
    mtagA: ["none"]
    mtagB: ["reorder"]
    tolerances:
      relative: 100.0
      absolute: 50.0
    post_operations:
      cartesian: false
      operations:
        - type: "GroupScale"
          params:
            a_scale_type: ["f32"]
            a_scale_len: ["1"]
            b_scale_type: ["f32"]
            b_scale_len: ["1"]
            group_size: ["0"]
        - type: "Bias"
          params:
            bias_type: ["f32"]
            bias_dim: ["n"]
        - type: "Elementwise-RELU"
        - type: "Scale"
          params:
            scale_factor: ["0.5"]
            scale_factor_type: ["f32"]
            scale_factor_len: ["1"]

  # 14.10: Zen6 KC(4096) guard -- K>4096 so the pc loop iterates on Zen6 too
  # (Zen4/5 KC=2048), combined with MC and NC crossing, reorder+pack, both
  # dtypes, single + multi-group.
  - name: "multipanel_zen6_kc4096_full"
    a_type: ["s8"]
    b_type: ["s4"]
    c_type: ["f32", "bf16"]
    acc_type: ["s32"]
    storage_format: ["row-major"]
    transA: [false]
    transB: [false]
    m: [16, 150]
    n: [64, 1088]
    k: [4224]
    alpha: [1]
    beta: [0]
    mtagA: ["none"]
    mtagB: ["reorder", "pack"]
    tolerances:
      relative: 100.0
      absolute: 50.0
    post_operations:
      cartesian: false
      operations:
        - type: "GroupScale"
          params:
            a_scale_type: ["f32"]
            a_scale_len: ["1"]
            b_scale_type: ["f32"]
            b_scale_len: ["1"]
            group_size: ["0", "128"]

# ============================================================================
# SECTION 15 -- PER-TOKEN (A) / PER-CHANNEL (B) granularity.
# Enabled by the unified-metadata per-token/per-channel feature: A PER_TOKEN =
# one scale per row (a_grp_mul=0, grp_post_op_lda=1); B PER_CHANNEL = one scale
# per column (b_grp_mul=0). This is the multi-group + per-row/col combination
# the earlier sections deliberately avoided (a single scale is reused across
# ALL K-groups). The harness derives scale lengths from granularity: A -> M,
# B -> N (independent of num_groups); the reference tiles M->M*ng / N->ng*N,
# giving an exact oracle. s8s4 is ROW-MAJOR only, so the column-major scale
# swap/transpose used by s8s8 is intentionally not exercised (and not needed).
# ============================================================================

  # 15.1: A PER_TOKEN x B PER_CHANNEL, MULTI-GROUP (ng>1), f32 scales. Covers
  # GEMV-N (n==1), GEMV-M (m==1) and the 5-loop GEMM, both output dtypes, with
  # M/N fringes.
  - name: "pertoken_perchannel_multigroup_f32sf"
    a_type: ["s8"]
    b_type: ["s4"]
    c_type: ["f32", "bf16"]
    acc_type: ["s32"]
    storage_format: ["row-major"]
    transA: [false]
    transB: [false]
    m: [1, 16, 37]
    n: [1, 32, 80]
    k: [256]
    alpha: [1]
    beta: [0]
    mtagA: ["none"]
    mtagB: ["reorder"]
    tolerances:
      relative: 100.0
      absolute: 50.0
    post_operations:
      cartesian: false
      operations:
        - type: "GroupScale"
          params:
            a_scale_type: ["f32"]
            b_scale_type: ["f32"]
            group_size: ["64", "128"]
            a_granularity: ["PER_TOKEN"]
            b_granularity: ["PER_CHANNEL"]

  # 15.2: same combination with bf16-stored scale factors (ref widens bf16->f32
  # losslessly, mirroring the kernel's DLP_BF16 branch).
  - name: "pertoken_perchannel_multigroup_bf16sf"
    a_type: ["s8"]
    b_type: ["s4"]
    c_type: ["f32", "bf16"]
    acc_type: ["s32"]
    storage_format: ["row-major"]
    transA: [false]
    transB: [false]
    m: [1, 16, 37]
    n: [1, 32, 80]
    k: [256]
    alpha: [1]
    beta: [0]
    mtagA: ["none"]
    mtagB: ["reorder"]
    tolerances:
      relative: 100.0
      absolute: 50.0
    post_operations:
      cartesian: false
      operations:
        - type: "GroupScale"
          params:
            a_scale_type: ["bf16"]
            b_scale_type: ["bf16"]
            group_size: ["64", "128"]
            a_granularity: ["PER_TOKEN"]
            b_granularity: ["PER_CHANNEL"]

  # 15.3: MIXED granularity -- A PER_TOKEN x B PER_GROUP (B still tiled by
  # group, A collapsed to per-row). Exercises a_grp_mul=0 with b_grp_mul=1.
  - name: "pertoken_A_pergroup_B_multigroup"
    a_type: ["s8"]
    b_type: ["s4"]
    c_type: ["f32", "bf16"]
    acc_type: ["s32"]
    storage_format: ["row-major"]
    transA: [false]
    transB: [false]
    m: [1, 16, 37]
    n: [1, 32, 80]
    k: [256]
    alpha: [1]
    beta: [0]
    mtagA: ["none"]
    mtagB: ["reorder"]
    tolerances:
      relative: 100.0
      absolute: 50.0
    post_operations:
      cartesian: false
      operations:
        - type: "GroupScale"
          params:
            a_scale_type: ["f32"]
            b_scale_type: ["f32"]
            group_size: ["64"]
            a_granularity: ["PER_TOKEN"]
            b_granularity: ["PER_GROUP"]

  # 15.4: MIXED granularity -- A PER_GROUP x B PER_CHANNEL (A tiled by group, B
  # collapsed to per-column). Exercises a_grp_mul=1 with b_grp_mul=0.
  - name: "pergroup_A_perchannel_B_multigroup"
    a_type: ["s8"]
    b_type: ["s4"]
    c_type: ["f32", "bf16"]
    acc_type: ["s32"]
    storage_format: ["row-major"]
    transA: [false]
    transB: [false]
    m: [1, 16, 37]
    n: [1, 32, 80]
    k: [256]
    alpha: [1]
    beta: [0]
    mtagA: ["none"]
    mtagB: ["reorder"]
    tolerances:
      relative: 100.0
      absolute: 50.0
    post_operations:
      cartesian: false
      operations:
        - type: "GroupScale"
          params:
            a_scale_type: ["f32"]
            b_scale_type: ["f32"]
            group_size: ["64"]
            a_granularity: ["PER_GROUP"]
            b_granularity: ["PER_CHANNEL"]

  # 15.5: transA / transB with per-token/per-channel, multi-group. Drives the
  # A VNNI-pack (transA) and col-major B packer (transB) paths under the new
  # granularity, both output dtypes.
  - name: "pertoken_perchannel_transAB_multigroup"
    a_type: ["s8"]
