    beta: [0, 1]
    mtagA: ["none"]
    mtagB: ["reorder", "pack"]
    tolerances:
      relative: 100.0
      absolute: 50.0
    post_operations:
      cartesian: false
      operations:
        - type: "GroupScale"
          params:
            a_scale_type: ["f32"]
            a_scale_len: ["1"]
            b_scale_type: ["f32"]
            b_scale_len: ["1"]
            group_size: ["0", "128"]

  # 14.4: transB=true (col-major s4 packer) at full crossing, pack path only.
  - name: "multipanel_transB_full"
    a_type: ["s8"]
    b_type: ["s4"]
    c_type: ["f32", "bf16"]
    acc_type: ["s32"]
    storage_format: ["row-major"]
    transA: [false]
    transB: [true]
    m: [16, 150]
    n: [64, 1088]
    k: [256, 2176]
    alpha: [1]
    beta: [0, 1]
    mtagA: ["none"]
    mtagB: ["pack"]
    tolerances:
      relative: 100.0
      absolute: 50.0
    post_operations:
      cartesian: false
      operations:
        - type: "GroupScale"
          params:
            a_scale_type: ["f32"]
            a_scale_len: ["1"]
            b_scale_type: ["f32"]
            b_scale_len: ["1"]
