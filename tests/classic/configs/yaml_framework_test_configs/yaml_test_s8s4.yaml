    n: [32, 80]
    k: [256]
    alpha: [1]
    beta: [0]
    mtagA: ["none"]
    mtagB: ["reorder"]
    tolerances:
      relative: 100.0
      absolute: 50.0
    post_operations:
      cartesian: false
      operations:
        - type: "GroupScale"
          params:
            a_scale_type: ["f32"]
            b_scale_type: ["f32"]
            group_size: ["64"]
            a_granularity: ["PER_TOKEN"]
            b_granularity: ["PER_CHANNEL"]

  # 15.6: single-group degenerate (group_size 0 -> K, and ==K): with ng==1,
  # PER_TOKEN/PER_CHANNEL and PER_GROUP coincide in length but exercise the
  # distinct outer_dim dispatch. Guards the API dim-validation + grp_mul logic.
  - name: "pertoken_perchannel_singlegroup"
    a_type: ["s8"]
    b_type: ["s4"]
    c_type: ["f32", "bf16"]
    acc_type: ["s32"]
    storage_format: ["row-major"]
    transA: [false]
    transB: [false]
