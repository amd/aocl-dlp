# ============================================================================
# Comprehensive s8 x s4 (symmetric group-quant) GEMM test matrix.
#
# APIs under test:
#   aocl_gemm_s8s4s32of32   (s8 A x s4 B -> f32 C)
#   aocl_gemm_s8s4s32obf16  (s8 A x s4 B -> bf16 C)
#
# The s8s4 path is symmetric group-quant ONLY (mandatory GroupScale post-op).
# Internally it sign-extends s4->s8 and reuses the s8s8 sym-quant AVX512-VNNI
# micro-kernels. There is no scalar/AVX2 reference kernel, no plain (non
# GroupScale) s8s4 GEMM, no batch API, and only f32/bf16 outputs.
#
# This file is organized so that each test set targets an ORTHOGONAL branch in
# the dispatch tree, and cartesian expansion is used WITHIN a set only where the
# axes are genuinely independent. The axes covered:
#
#   [A] Output dtype ............ f32 / bf16 (two APIs, distinct downscale)
#   [B] Top-level path .......... GEMV fast path vs general 5-loop GEMM
#   [C] GEMV sub-path ........... N==1 direct / M==1 widen / transA A-gather
#   [D] mtagB ................... reorder (widen-per-panel) / pack / none (->pack)
#   [E] transB .................. false (row-major packer) / true (col-major)
#   [F] transA .................. false (A direct) / true (A VNNI-pack)
#   [G] group_size .............. 0(->K) / ==K (single group) / <K multi-group
#   [H] KC straddle ............. K > KC(2048) with 2048 % gs != 0
#   [I] partial trailing group .. k % gs != 0 (ceil last group)
#   [J] K padding ............... k % 4 != 0 / odd nibble (s4 pack tail)
#   [K] scale layout ............ A: 1/m ; B: 1/n (per-row/col only single-group)
#   [L] M fringe (MR=6) ......... m remainders + MC(144) blocking
#   [M] N fringe (NR=64) ........ 16/32/48 sub-kernels, <16, >64, NC(1024)
#   [N] beta .................... 0 (overwrite) / 1 (accumulate)
#   [O] alpha ................... 1 and !=1
#   [P] post-ops ................ GroupScale + each supported epilogue op
#
# GroupScale scale-length note: with a_scale_len "m" / b_scale_len "n" the
# harness produces only m / n scale values. That is exact ONLY for a single
# group (num_groups==1, i.e. group_size 0 or ==k), because a multi-group kernel
# indexes a_scale[row*ng+g] / b_scale[g*n+col]. Multi-group sets therefore use
# scalar scales (len "1"), which both DLP and ref adaptors broadcast.
#
# GEMV fast-path eligibility (API front-end): mtagB==reorder AND (m==1 OR n==1)
# AND group_size>0(after 0->k) AND k % gs == 0 AND KC(2048) % gs == 0. Group
# sizes 16/32/64/128/256 all divide 2048.
# ============================================================================

gemm_tests:

# ============================================================================
# REGRESSION GUARDS (pre-existing defects). Kept verbatim -- these encode the
# exact triggering shapes for three historical N==1 sym-quant GEMV bugs plus
# two KC-straddle bugs. Do not fold these into the sweeps below; the specific
# (m,n,k,group_size,mtag) tuples are load-bearing.
# ============================================================================

  # Defect 1: N==1, group_size >= 128, M >= 4. A-pointer failed to advance to
  # the next 64-wide k-block, so every k-iter after the first re-read block 0.
  - name: "regress_symquant_defect1_gemv_n1_gs128"
    a_type: ["s8"]
    b_type: ["s4"]
    c_type: ["f32", "bf16"]
    acc_type: ["s32"]
    storage_format: ["row-major"]
    transA: [false]
    transB: [false]
    m: [1, 2, 3, 4, 5, 7, 8, 9, 15, 16, 17, 31, 32, 48]
    n: [1]
    k: [128]
    alpha: [1]
    beta: [0, 1]
    mtagA: ["none"]
    mtagB: ["reorder"]
    tolerances:
      relative: 100.0
      absolute: 50.0
    post_operations:
      cartesian: false
      operations:
        - type: "GroupScale"
          params:
            a_scale_type: ["f32"]
            a_scale_len: ["1", "m"]
            b_scale_type: ["f32"]
            b_scale_len: ["1", "n"]
            group_size: ["128"]

  # Defect 1 (deeper): group_size 256 gives k_iter == 4 inside one group.
  - name: "regress_symquant_defect1_gemv_n1_gs256"
    a_type: ["s8"]
    b_type: ["s4"]
    c_type: ["f32"]
    acc_type: ["s32"]
    storage_format: ["row-major"]
    transA: [false]
    transB: [false]
    m: [4, 8, 16, 17, 33]
    n: [1]
    k: [256]
    alpha: [1]
    beta: [0]
    mtagA: ["none"]
    mtagB: ["reorder"]
    tolerances:
      relative: 100.0
      absolute: 50.0
    post_operations:
      cartesian: false
      operations:
        - type: "GroupScale"
          params:
            a_scale_type: ["f32"]
            a_scale_len: ["1", "m"]
            b_scale_type: ["f32"]
            b_scale_len: ["1", "n"]
            group_size: ["256"]

  # Defect 3: row-major + transA with N==1 forces A-packing (A-gather path).
  # Before the fix this read out of bounds.
  - name: "regress_symquant_defect3_gemv_n1_transA"
    a_type: ["s8"]
    b_type: ["s4"]
    c_type: ["f32", "bf16"]
    acc_type: ["s32"]
    storage_format: ["row-major"]
    transA: [true]
    transB: [false]
    m: [1, 4, 8, 16, 17, 64]
    n: [1]
    k: [128]
    alpha: [1]
    beta: [0, 1]
    mtagA: ["none"]
    mtagB: ["reorder"]
    tolerances:
      relative: 100.0
      absolute: 50.0
    post_operations:
      cartesian: false
      operations:
        - type: "GroupScale"
          params:
            a_scale_type: ["f32"]
            a_scale_len: ["1", "m"]
            b_scale_type: ["f32"]
            b_scale_len: ["1", "n"]
            group_size: ["128"]

  # Defect 2: group straddles a KC(2048) boundary. K > 2048 and 2048 % gs != 0
  # (2048 % 20 == 8). s8s4 5-loop only GROWS KC to group_size, it never shrinks
  # to a multiple of gs (unlike s8s8), so this exercises the divergent path.
  # Multi-group => scalar scales.
  - name: "regress_symquant_defect2_kc_straddle_gs20"
    a_type: ["s8"]
    b_type: ["s4"]
    c_type: ["f32"]
    acc_type: ["s32"]
    storage_format: ["row-major"]
    transA: [false]
    transB: [false]
    m: [1, 4, 16]
    n: [1, 16]
    k: [2180]
    alpha: [1]
    beta: [0, 1]
    mtagA: ["none"]
    mtagB: ["reorder"]
    tolerances:
      relative: 100.0
      absolute: 50.0
    post_operations:
      cartesian: false
      operations:
        - type: "GroupScale"
          params:
            a_scale_type: ["f32"]
            a_scale_len: ["1"]
            b_scale_type: ["f32"]
            b_scale_len: ["1"]
            group_size: ["20"]

  # Defect 2 (larger group): 2048 % 160 == 128, K == 2560 (16 groups).
  - name: "regress_symquant_defect2_kc_straddle_gs160"
    a_type: ["s8"]
    b_type: ["s4"]
    c_type: ["f32", "bf16"]
    acc_type: ["s32"]
    storage_format: ["row-major"]
    transA: [false]
    transB: [false]
    m: [1, 8, 16]
    n: [1, 16]
    k: [2560]
    alpha: [1]
    beta: [0]
    mtagA: ["none"]
    mtagB: ["reorder"]
    tolerances:
      relative: 100.0
      absolute: 50.0
    post_operations:
      cartesian: false
      operations:
        - type: "GroupScale"
          params:
            a_scale_type: ["f32"]
            a_scale_len: ["1"]
            b_scale_type: ["f32"]
            b_scale_len: ["1"]
            group_size: ["160"]

  # Defect 4 (OOB): single-group KC-GROW to a non-multiple-of-4. When
  # group_size > KC the s8s4 path GROWS KC to group_size (never shrinks in this
  # branch), so KC = group_size = k. kc0_updated = round_up(kc0,4) then exceeds
  # KC by up to 3, overrunning the NR*KC b_panel_s8 (compute) and strip_s8
  # (reorder) scratch. k=2050 > KC(2048) with 2050 % 4 == 2 (overrun +2 rows).
  # NOTE: masked on a normal build by the ~4KB over-allocation cushion in
  # dlp_malloc_page_aligned; reliably caught only with ASan + a tight allocator.
  - name: "regress_symquant_defect4_kcgrow_singlegroup_k2050"
    a_type: ["s8"]
    b_type: ["s4"]
    c_type: ["f32"]
    acc_type: ["s32"]
    storage_format: ["row-major"]
    transA: [false]
    transB: [false]
    m: [1, 16]
    n: [1, 16, 64]
    k: [2050]
    alpha: [1]
    beta: [0]
    mtagA: ["none"]
    mtagB: ["reorder"]
    tolerances:
      relative: 100.0
      absolute: 50.0
    post_operations:
      cartesian: false
      operations:
        - type: "GroupScale"
          params:
            a_scale_type: ["f32"]
            a_scale_len: ["1"]
            b_scale_type: ["f32"]
            b_scale_len: ["1"]
            group_size: ["0", "2050"]

  # Defect 4 (max overrun +3). k=4097 > KC on Zen4/5 (2048) AND Zen6 (4096);
  # KC grows to 4097, round_up(4097,4)=4100 -> 3 extra rows.
  - name: "regress_symquant_defect4_kcgrow_singlegroup_k4097"
    a_type: ["s8"]
    b_type: ["s4"]
    c_type: ["f32", "bf16"]
    acc_type: ["s32"]
    storage_format: ["row-major"]
    transA: [false]
    transB: [false]
    m: [1, 16]
    n: [1, 16]
    k: [4097]
    alpha: [1]
    beta: [0]
    mtagA: ["none"]
    mtagB: ["reorder"]
    tolerances:
      relative: 100.0
      absolute: 50.0
    post_operations:
      cartesian: false
      operations:
        - type: "GroupScale"
          params:
            a_scale_type: ["f32"]
            a_scale_len: ["1"]
            b_scale_type: ["f32"]
            b_scale_len: ["1"]
            group_size: ["0", "4097"]

# ============================================================================
# SECTION 1 -- GEMV N==1 fast path (reorder B), no transpose.
# Path: API front-end -> s8s8 sym-quant GEMV-N kernel (reordered B consumed
# directly: tight s8 column + per-group colsums). M sweep covers the >=4/>=8/
# primary(16)/multi-tile(>16) micro-kernel unrolls. group_size sweep covers a
# single k-iter group (32/64) vs multi-iter (128), and gs==0(->k) per-tensor.
# Both output dtypes. Per-row A / per-col B scales are exact here (single group
# only for gs>=k; multi-group rows still use scalar via len "1").
# ============================================================================
  - name: "gemv_n1_reorder_dtype_gs_sweep"
    a_type: ["s8"]
    b_type: ["s4"]
    c_type: ["f32", "bf16"]
    acc_type: ["s32"]
    storage_format: ["row-major"]
    transA: [false]
    transB: [false]
    m: [1, 5, 6, 7, 16, 33]
    n: [1]
    k: [128]
    alpha: [1]
    beta: [0, 1]
    mtagA: ["none"]
    mtagB: ["reorder"]
    tolerances:
      relative: 100.0
      absolute: 50.0
    post_operations:
      cartesian: false
      operations:
        - type: "GroupScale"
          params:
            a_scale_type: ["f32"]
            a_scale_len: ["1"]
            b_scale_type: ["f32"]
            b_scale_len: ["1"]
            group_size: ["0", "32", "64", "128"]

# ============================================================================
# SECTION 2 -- GEMV M==1 fast path (reorder B), widen path.
# Path: m==1 -> compact s4 reordered B is widened once via
# dlp_cvt_s4_to_s8_linear_avx512, then the s8s8 GEMV-M kernel runs. Distinct
# from N==1. N sweep exercises the N fringe of the M==1 kernel (16/32/48 lanes,
# <16 tail, and >64 multi-tile). Single group so per-col B scale ("n") is exact.
# ============================================================================
  - name: "gemv_m1_reorder_widen_nfringe"
    a_type: ["s8"]
    b_type: ["s4"]
    c_type: ["f32", "bf16"]
    acc_type: ["s32"]
    storage_format: ["row-major"]
    transA: [false]
    transB: [false]
    m: [1]
    n: [15, 16, 17, 32, 48, 64, 65, 127]
    k: [128]
    alpha: [1]
    beta: [0, 1]
    mtagA: ["none"]
    mtagB: ["reorder"]
    tolerances:
      relative: 100.0
      absolute: 50.0
    post_operations:
      cartesian: false
      operations:
        - type: "GroupScale"
          params:
            a_scale_type: ["f32"]
            a_scale_len: ["1", "m"]
            b_scale_type: ["f32"]
            b_scale_len: ["1", "n"]
            group_size: ["0", "128"]

# ============================================================================
# SECTION 3 -- m==1 / n==1 that are DELIBERATELY NOT GEMV-eligible.
# mtagB pack/none disqualifies the GEMV fast path, so these route through the
# general 5-loop even though a dimension is 1. Guards that the 5-loop handles
# degenerate MR/NR tiles. (mtagB "none" is promoted to PACK internally.)
# ============================================================================
  - name: "vec_shapes_forced_into_5loop"
    a_type: ["s8"]
    b_type: ["s4"]
    c_type: ["f32", "bf16"]
    acc_type: ["s32"]
    storage_format: ["row-major"]
    transA: [false]
    transB: [false]
    m: [1, 3]
    n: [1, 16]
    k: [128]
    alpha: [1]
    beta: [0]
    mtagA: ["none"]
    mtagB: ["pack", "none"]
    tolerances:
      relative: 100.0
      absolute: 50.0
    post_operations:
      cartesian: false
      operations:
        - type: "GroupScale"
          params:
            a_scale_type: ["f32"]
            a_scale_len: ["1"]
            b_scale_type: ["f32"]
            b_scale_len: ["1"]
            group_size: ["0", "64"]

# ============================================================================
# SECTION 4 -- General 5-loop GEMM: B path (reorder vs pack vs none).
# reorder => per-NR-panel widen into b_panel_s8 scratch; pack/none => runtime
# parallel PACK with fused s4->s8 widen-on-load (row-major packer, cs_b==1).
# Full N-fringe sweep hits the 6x64 / 6x48 / 6x32 / 6x16 / 6x<16 sub-kernels
# and >64 NR tiling. group_size single group (per-row/col scales exact).
# ============================================================================
  - name: "gemm_5loop_bpath_nfringe"
    a_type: ["s8"]
    b_type: ["s4"]
    c_type: ["f32", "bf16"]
    acc_type: ["s32"]
    storage_format: ["row-major"]
    transA: [false]
    transB: [false]
    m: [16]
    n: [15, 16, 31, 32, 47, 48, 63, 64, 65, 127, 128]
    k: [128]
    alpha: [1]
    beta: [0, 1]
    mtagA: ["none"]
    mtagB: ["reorder", "pack", "none"]
    tolerances:
      relative: 100.0
      absolute: 50.0
    post_operations:
      cartesian: false
      operations:
        - type: "GroupScale"
          params:
            a_scale_type: ["f32"]
            a_scale_len: ["1", "m"]
            b_scale_type: ["f32"]
            b_scale_len: ["1", "n"]
            group_size: ["0"]

# ============================================================================
# SECTION 5 -- General 5-loop GEMM: M fringe (MR=6) and MC(144) blocking.
# m remainders 1..5 after each 6-row block, plus m>144 to cross the MC panel
# boundary (multi-panel A). Multi-group scalar scales included to exercise the
# in-kernel per-group scale advance across MC panels.
# ============================================================================
  - name: "gemm_5loop_mfringe_mc_block"
    a_type: ["s8"]
    b_type: ["s4"]
    c_type: ["f32"]
    acc_type: ["s32"]
    storage_format: ["row-major"]
    transA: [false]
    transB: [false]
    m: [1, 2, 5, 6, 7, 12, 13, 144, 145, 150]
    n: [32]
    k: [256]
    alpha: [1]
    beta: [0]
    mtagA: ["none"]
    mtagB: ["reorder"]
    tolerances:
      relative: 100.0
      absolute: 50.0
    post_operations:
      cartesian: false
      operations:
        - type: "GroupScale"
          params:
            a_scale_type: ["f32"]
            a_scale_len: ["1"]
            b_scale_type: ["f32"]
            b_scale_len: ["1"]
            group_size: ["64"]

# ============================================================================
# SECTION 6 -- transA=true general 5-loop (A VNNI-pack path).
# transA forces mtag_a=PACK at the API; A is packed via packa_fun_ptr instead
# of the direct cs_a=4 broadcast. m,n>=2 keeps it out of the GEMV fast path.
# ============================================================================
  - name: "gemm_5loop_transA_apack"
    a_type: ["s8"]
    b_type: ["s4"]
    c_type: ["f32", "bf16"]
    acc_type: ["s32"]
    storage_format: ["row-major"]
    transA: [true]
    transB: [false]
    m: [6, 16, 17, 64]
    n: [16, 64]
    k: [128, 256]
    alpha: [1]
    beta: [0, 1]
    mtagA: ["none"]
    mtagB: ["reorder", "pack"]
    tolerances:
      relative: 100.0
      absolute: 50.0
    post_operations:
      cartesian: false
      operations:
        - type: "GroupScale"
          params:
            a_scale_type: ["f32"]
            a_scale_len: ["1"]
            b_scale_type: ["f32"]
            b_scale_len: ["1"]
            group_size: ["0", "128"]

# ============================================================================
# SECTION 7 -- transB=true (col-major B panel) via the PACK path.
# cs_b != 1 selects dlp_packb_nr64_s8s4s32os32_col_major (distinct s4 packer).
# ============================================================================
  - name: "gemm_5loop_transB_colmajor_packer"
    a_type: ["s8"]
    b_type: ["s4"]
    c_type: ["f32", "bf16"]
    acc_type: ["s32"]
    storage_format: ["row-major"]
    transA: [false]
    transB: [true]
    m: [1, 16]
    n: [16, 48, 64]
    k: [128]
    alpha: [1]
    beta: [0, 1]
    mtagA: ["none"]
    mtagB: ["pack"]
    tolerances:
      relative: 100.0
      absolute: 50.0
    post_operations:
      cartesian: false
      operations:
        - type: "GroupScale"
          params:
            a_scale_type: ["f32"]
            a_scale_len: ["1"]
            b_scale_type: ["f32"]
            b_scale_len: ["1"]
            group_size: ["0", "32", "64", "128"]

# ============================================================================
# SECTION 8 -- group_size structural variants (multi-group, 5-loop).
# Covers: gs==k (single group), gs<k evenly dividing (full groups), and gs<k
# NOT dividing k => partial trailing group (num_groups=ceil(k/gs)). Multi-group
# => scalar scales. group_size sweep of 16/32/64 (all multiples of 4).
# ============================================================================
  - name: "gemm_groupsize_multigroup_and_partial"
    a_type: ["s8"]
    b_type: ["s4"]
    c_type: ["f32", "bf16"]
    acc_type: ["s32"]
    storage_format: ["row-major"]
    transA: [false]
    transB: [false]
    # k=200: 200%16=8, 200%32=8, 200%64=8 -> exercises a partial last group.
    # k=192: divisible by 16/32/64 -> all full groups.
    m: [8, 16]
    n: [32, 64]
    k: [192, 200]
    alpha: [1]
    beta: [0]
    mtagA: ["none"]
    mtagB: ["reorder", "pack"]
    tolerances:
      relative: 100.0
      absolute: 50.0
    post_operations:
      cartesian: false
      operations:
        - type: "GroupScale"
          params:
            a_scale_type: ["f32"]
            a_scale_len: ["1"]
            b_scale_type: ["f32"]
            b_scale_len: ["1"]
            group_size: ["16", "32", "64"]

# ============================================================================
# SECTION 9 -- K/nibble padding fringe.
# k not a multiple of 4 forces k_updated=round_up(k,4) padding, and odd K means
# the high nibble of the last s4 byte is unused (must be zeroed in the widen
# scratch). group_size 0(->k) keeps a single group so the odd/unaligned K is
# legal (gs==k bypasses the gs%4 requirement).
# ============================================================================
  - name: "gemm_k_nibble_padding_fringe"
    a_type: ["s8"]
    b_type: ["s4"]
    c_type: ["f32", "bf16"]
    acc_type: ["s32"]
    storage_format: ["row-major"]
    transA: [false]
    transB: [false]
    m: [1, 8, 16]
    n: [1, 16, 32]
    k: [1, 2, 3, 5, 17, 127, 130]
    alpha: [1]
    beta: [0]
    mtagA: ["none"]
    mtagB: ["reorder", "pack"]
    tolerances:
      relative: 100.0
      absolute: 50.0
    post_operations:
      cartesian: false
      operations:
        - type: "GroupScale"
          params:
            a_scale_type: ["f32"]
            a_scale_len: ["1"]
            b_scale_type: ["f32"]
            b_scale_len: ["1"]
            group_size: ["0"]

# ============================================================================
# SECTION 10 -- NC(1024) column blocking + large-N multi-tile.
# n > NC crosses the NC panel boundary; also large K (still <= KC) with full
# single group. Kept to one dtype/shape to avoid redundancy with fringe sweeps.
# ============================================================================
  - name: "gemm_nc_block_largeN"
    a_type: ["s8"]
    b_type: ["s4"]
    c_type: ["f32"]
    acc_type: ["s32"]
    storage_format: ["row-major"]
    transA: [false]
    transB: [false]
    m: [16]
    n: [1024, 1088]
    k: [512]
    alpha: [1]
    beta: [0, 1]
    mtagA: ["none"]
    mtagB: ["reorder", "pack"]
    tolerances:
      relative: 100.0
      absolute: 50.0
    post_operations:
      cartesian: false
      operations:
        - type: "GroupScale"
          params:
            a_scale_type: ["f32"]
            a_scale_len: ["1"]
            b_scale_type: ["f32"]
            b_scale_len: ["1"]
            group_size: ["0", "128"]

# ============================================================================
# SECTION 11 -- alpha scaling (!= 1). alpha is applied as an integer scale of
# the s32 accumulator; combined with beta=1 accumulate. Single group.
# ============================================================================
  - name: "gemm_alpha_beta_scaling"
    a_type: ["s8"]
    b_type: ["s4"]
    c_type: ["f32"]
    acc_type: ["s32"]
    storage_format: ["row-major"]
    transA: [false]
    transB: [false]
    m: [16]
    n: [16, 64]
    k: [128]
    alpha: [1, 2]
    beta: [0, 1]
    mtagA: ["none"]
    mtagB: ["reorder"]
    tolerances:
      relative: 100.0
      absolute: 50.0
    post_operations:
      cartesian: false
      operations:
        - type: "GroupScale"
          params:
            a_scale_type: ["f32"]
            a_scale_len: ["1"]
            b_scale_type: ["f32"]
            b_scale_len: ["1"]
            group_size: ["0"]

# ============================================================================
# SECTION 12 -- bf16 scale factor storage.
# The DLP sym-quant micro-kernel widens bf16-typed scale factors to f32
# losslessly before the dequant multiply (sf_stor_type==DLP_BF16 branch in
# dlp_gemm_6x64rowmajor_s8_grp_amd512vnni.c). The test reference mirrors this
# (ual_plan_ref.cc read_sf() -> bf16_to_f32, materializing f32 scale buffers),
# so bf16-stored scales are validated against f32-equivalent math. A and B must
# share one scale storage type (the library rejects a mixed bf16/f32 pair).
# ============================================================================

  # 12.1: bf16 scale factors across the GEMV (n==1 / m==1) and 5-loop GEMM
  # paths, f32 and bf16 output, single-group (0) and multi-group (64).
  - name: "gemm_bf16_scale_storage"
    a_type: ["s8"]
    b_type: ["s4"]
    c_type: ["f32", "bf16"]
    acc_type: ["s32"]
    storage_format: ["row-major"]
    transA: [false]
    transB: [false]
    m: [1, 16]
    n: [1, 32]
    k: [128]
    alpha: [1]
    beta: [0]
    mtagA: ["none"]
    mtagB: ["reorder"]
    tolerances:
      relative: 100.0
      absolute: 50.0
    post_operations:
      cartesian: false
      operations:
        - type: "GroupScale"
          params:
            a_scale_type: ["bf16"]
            b_scale_type: ["bf16"]
            group_size: ["0", "64"]

  # 12.2: bf16 scales on the OFFSET-INDEXED paths -- the distinct bf16 concern
  # is the 2-byte scale-buffer stride when the kernel indexes it with panel
  # offsets. Cross MC(144)/NC(1024)/KC(2048) with K>KC, both a KC-aligned group
  # (gs=64) and a KC-straddling group with a partial trailing group
  # (gs=192: 2048 % 192 != 0 and 2176 % 192 != 0), reorder + pack, f32 + bf16
  # output.
  - name: "bf16_scale_multipanel_straddle"
    a_type: ["s8"]
    b_type: ["s4"]
    c_type: ["f32", "bf16"]
    acc_type: ["s32"]
    storage_format: ["row-major"]
    transA: [false]
    transB: [false]
    m: [16, 150]
    n: [64, 1088]
    k: [2176]
    alpha: [1]
    beta: [0]
    mtagA: ["none"]
    mtagB: ["reorder", "pack"]
    tolerances:
      relative: 100.0
      absolute: 50.0
    post_operations:
      cartesian: false
      operations:
        - type: "GroupScale"
          params:
            a_scale_type: ["bf16"]
            b_scale_type: ["bf16"]
            group_size: ["64", "192"]

  # 12.3: bf16 scales with transA / transB and a fused post-op chain, multi-
  # group. Confirms the widen-on-read is orthogonal to the A VNNI-pack /
  # col-major B packer paths and to epilogue fusion. f32 + bf16 output.
  - name: "bf16_scale_transAB_postop"
    a_type: ["s8"]
    b_type: ["s4"]
    c_type: ["f32", "bf16"]
    acc_type: ["s32"]
    storage_format: ["row-major"]
    transA: [false, true]
    transB: [false, true]
    m: [16, 37]
    n: [32, 80]
    k: [256]
    alpha: [1]
    beta: [0]
    mtagA: ["none"]
    mtagB: ["reorder"]
    tolerances:
      relative: 100.0
      absolute: 50.0
    post_operations:
      cartesian: false
      operations:
        - type: "GroupScale"
          params:
            a_scale_type: ["bf16"]
            b_scale_type: ["bf16"]
            group_size: ["64"]
        - type: "Bias"
          params:
            bias_type: ["f32"]
            bias_dim: ["n"]
        - type: "Elementwise-RELU"

